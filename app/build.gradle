plugins {
    id 'com.android.application'
}

android {
    namespace 'uk.tidyquest.app'
    compileSdk 34

    defaultConfig {
        applicationId 'uk.tidyquest.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2-trial'
    }

    // Fixed trial key so updates install over the top and keep each family's data.
    signingConfigs {
        trial {
            storeFile file('trial.keystore')
            storePassword 'tidyquest'
            keyAlias 'trial'
            keyPassword 'tidyquest'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.trial
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
