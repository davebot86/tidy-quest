<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Tidy Quest</title>
<style>
/* Fonts are bundled into assets/fonts by the GitHub build; every face has a fallback stack. */
@font-face{font-family:"Nunito";src:url(fonts/nunito-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito-900.woff2) format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:"Shippori";src:url(fonts/shippori-mincho-b1-800.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"Stencil";src:url(fonts/saira-stencil-one-400.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Bangers";src:url(fonts/bangers-400.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Bungee";src:url(fonts/bungee-400.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Orbitron";src:url(fonts/orbitron-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Bebas";src:url(fonts/bebas-neue-400.woff2) format("woff2");font-display:swap}

/*
  Design plan
  Each style is a place the child stands in, with a master who talks to them:
    Dojo   washi paper, dark wood, hinomaru red, gold      Sensei
    Army   olive canvas, khaki dossier, signal orange      Sergeant Stone
    Hero   comic blue, halftone, red and sun yellow        Captain Comet
    Pop    midnight stage, magenta and cyan light          DJ Nova
    Space  deep space, cyan HUD, warm thruster orange      Commander Vega
    Pitch  striped grass, chalk white, kit red, gold       Coach Mac
  Layout: master's stage at the top, then the child, then today's quests. Left aligned, one column.
  Body type is Nunito throughout (round, very readable for young children); each world has its own display face.
*/
:root{
  --bg:#EEF1F4; --world:var(--bg); --panel:#FFFFFF; --ink:#17202A; --muted:#5B6673; --line:#D8DEE5;
  --accent:#0F6E68; --accent-ink:#FFFFFF; --accent2:#C98A1B; --good:#1F8A4C; --warn:#C46A12; --bad:#C2352B;
  --stage:#17202A; --stage-ink:#FFFFFF; --bubble:#FFFFFF; --bubble-ink:#17202A; --fig:#17202A;
  --display:"Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif; --dweight:900; --dcase:none; --dspace:0;
  --radius:16px; --card-radius:16px; --card-border:1px solid var(--line); --card-shadow:0 1px 0 rgba(23,32,42,.06),0 6px 18px -10px rgba(23,32,42,.25);
}
/* Dojo */
body[data-theme="karate"]{--bg:#EFE5CF;--panel:#FBF6EA;--ink:#221A13;--muted:#76685A;--line:#DCCDAF;--accent:#1C4B47;--accent-ink:#FFF8EE;--accent2:#B8862F;
  --stage:#3A2A1E;--stage-ink:#F6EBD3;--bubble:#FBF6EA;--bubble-ink:#221A13;--fig:#221A13;--display:"Shippori","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",Georgia,serif;--dweight:800;
  --world:
    repeating-linear-gradient(90deg,rgba(120,90,50,.035) 0 2px,transparent 2px 7px),
    repeating-linear-gradient(0deg,rgba(120,90,50,.03) 0 1px,transparent 1px 5px),#EFE5CF;
  --card-radius:6px;--card-border:1px solid #D6C6A6;--card-shadow:0 1px 0 #fff inset,0 10px 20px -14px rgba(58,42,30,.6)}
/* Army */
body[data-theme="army"]{--bg:#3E4A2C;--panel:#E3D6B2;--ink:#20261A;--muted:#5C5A44;--line:#C7B78C;--accent:#E07B24;--accent-ink:#1E140A;--accent2:#6E7D45;
  --stage:#232A18;--stage-ink:#E9DFBF;--bubble:#E9DFBF;--bubble-ink:#20261A;--fig:#20261A;--display:"Stencil","Black Ops One","Impact",sans-serif;--dweight:400;--dspace:.02em;
  --world:radial-gradient(60px 40px at 15% 20%,#435030 60%,transparent 62%) 0 0/260px 300px,radial-gradient(80px 50px at 70% 35%,#3A4527 60%,transparent 62%) 0 0/260px 300px,
    radial-gradient(70px 45px at 40% 75%,#435030 60%,transparent 62%) 0 0/260px 300px,#3E4A2C;
  --card-radius:4px;--card-border:2px solid #B9A87A;--card-shadow:4px 4px 0 rgba(0,0,0,.35)}
body[data-theme="army"] .on-world{color:#E9DFBF}
/* Hero */
body[data-theme="hero"]{--bg:#1B2B7A;--panel:#FFFFFF;--ink:#101633;--muted:#4A5280;--line:#101633;--accent:#E23A2E;--accent-ink:#FFFFFF;--accent2:#FFD23F;
  --stage:#FFD23F;--stage-ink:#101633;--bubble:#FFFFFF;--bubble-ink:#101633;--fig:#101633;--display:"Bangers","Impact",sans-serif;--dweight:400;--dspace:.04em;
  --world:radial-gradient(circle,rgba(255,255,255,.09) 2px,transparent 2.5px) 0 0/14px 14px,#1B2B7A;
  --card-radius:6px;--card-border:3px solid #101633;--card-shadow:5px 5px 0 #101633}
body[data-theme="hero"] .on-world{color:#FFFFFF}
/* Pop */
body[data-theme="pop"]{--bg:#1A0E2E;--panel:#26173F;--ink:#FFF4FB;--muted:#C9B4E8;--line:#40285F;--accent:#FF3EA5;--accent-ink:#FFFFFF;--accent2:#3EE7FF;
  --stage:#120822;--stage-ink:#FFF4FB;--bubble:#FFF4FB;--bubble-ink:#1A0E2E;--fig:#FF3EA5;--display:"Bungee","Impact",sans-serif;--dweight:400;
  --world:radial-gradient(40% 30% at 15% 0%,rgba(255,62,165,.35),transparent 70%),radial-gradient(40% 30% at 85% 0%,rgba(62,231,255,.28),transparent 70%),#1A0E2E;
  --card-radius:18px;--card-border:1px solid #4E3275;--card-shadow:0 0 0 1px rgba(255,62,165,.15),0 12px 30px -16px rgba(255,62,165,.6)}
body[data-theme="pop"] .on-world{color:#FFF4FB}
/* Space */
body[data-theme="space"]{--bg:#070B1D;--panel:#111939;--ink:#EAF2FF;--muted:#98A6D4;--line:#25336B;--accent:#5FE0FF;--accent-ink:#04102A;--accent2:#FF9F43;
  --stage:#0C1430;--stage-ink:#EAF2FF;--bubble:#EAF2FF;--bubble-ink:#070B1D;--fig:#5FE0FF;--display:"Orbitron","Trebuchet MS",sans-serif;--dweight:700;--dspace:.03em;
  --world:radial-gradient(1px 1px at 10% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 70%,#cfe,transparent),radial-gradient(1.5px 1.5px at 60% 30%,#fff,transparent),
    radial-gradient(1px 1px at 80% 60%,#fff,transparent),radial-gradient(1px 1px at 50% 90%,#aef,transparent),radial-gradient(1.5px 1.5px at 90% 10%,#fff,transparent) 0 0/220px 220px,#070B1D;
  --card-radius:12px;--card-border:1px solid #2C3D7D;--card-shadow:0 0 0 1px rgba(95,224,255,.08),0 14px 30px -18px rgba(95,224,255,.45)}
body[data-theme="space"] .on-world{color:#EAF2FF}
/* Pitch */
body[data-theme="football"]{--bg:#1E7B3E;--panel:#F7F9F4;--ink:#13261A;--muted:#4E6A57;--line:#CFDDD2;--accent:#D62828;--accent-ink:#FFFFFF;--accent2:#F2C14E;
  --stage:#13261A;--stage-ink:#F7F9F4;--bubble:#F7F9F4;--bubble-ink:#13261A;--fig:#13261A;--display:"Bebas","Impact","Arial Narrow",sans-serif;--dweight:400;--dspace:.04em;
  --world:repeating-linear-gradient(180deg,#1E7B3E 0 64px,#228A46 64px 128px);
  --card-radius:10px;--card-border:1px solid #CFDDD2;--card-shadow:0 10px 22px -14px rgba(0,0,0,.6)}
body[data-theme="football"] .on-world{color:#F7F9F4}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--world);background-attachment:fixed;color:var(--ink);font:400 17px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
img{max-width:100%;display:block}
[hidden]{display:none!important}
#app{max-width:760px;margin:0 auto;padding-block:14px 48px;display:flex;flex-direction:column;gap:18px}

h1,h2,h3{margin:0;text-wrap:balance}
.display{font-family:var(--display);font-weight:var(--dweight);letter-spacing:var(--dspace);text-transform:var(--dcase);line-height:1.05}
h1.display{font-size:clamp(30px,8vw,46px)}
h2.display{font-size:clamp(22px,5.4vw,30px)}
.label{font-size:14px;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);color:var(--ink);border-radius:var(--card-radius);padding:16px;border:var(--card-border);box-shadow:var(--card-shadow)}
.on-world{color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn.big{min-height:66px;font-size:21px;width:100%}
.btn svg{width:24px;height:24px;flex:none}
.btn.ghost{background:var(--panel);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.small{min-height:40px;padding:0 16px;font-size:15px}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:transparent;color:var(--bad);border:1.5px solid var(--bad);box-shadow:none}
.btn:disabled{opacity:.4;box-shadow:none}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.iconbtn{width:46px;height:46px;border-radius:50%;display:inline-grid;place-items:center;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)}
.iconbtn svg{width:22px;height:22px}
.topbar{display:flex;align-items:center;gap:12px}
.topbar .grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;background:rgba(127,127,127,.14);color:inherit}
.chip.wait{background:var(--warn);color:#fff}
.chip.prize{background:var(--accent);color:var(--accent-ink)}

/* Master's stage */
.stage{position:relative;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:end;background:var(--stage);color:var(--stage-ink);
  border-radius:calc(var(--card-radius) + 4px);padding:16px 16px 0;overflow:hidden;min-height:150px}
.mentor-btn{display:block;align-self:end;grid-column:1}
.stage .mentor{width:116px;height:132px;display:block;align-self:end;cursor:pointer;position:relative;z-index:1}
.stage .who{grid-column:1;font-weight:900;font-size:14px;padding-bottom:10px;text-align:center;position:relative;z-index:1}
.bubble{grid-row:1/3;grid-column:2;align-self:center;position:relative;z-index:1;background:var(--bubble);color:var(--bubble-ink);border-radius:18px;padding:14px 16px;
  font-weight:700;font-size:18px;line-height:1.35;margin-bottom:16px;box-shadow:0 8px 20px -12px rgba(0,0,0,.5)}
.bubble::before{content:"";position:absolute;left:-10px;bottom:22px;border:10px solid transparent;border-right-color:var(--bubble);border-left:0}
.bubble small{display:block;font-size:14px;font-weight:700;opacity:.65;margin-bottom:2px}
body[data-theme="karate"] .stage{background:
  radial-gradient(70px 70px at 74px 62px,#E8B04B 98%,transparent 100%),
  repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 46px),
  linear-gradient(#3A2A1E,#2B1F16)}
body[data-theme="karate"] .bubble{border-radius:4px;border-left:4px solid #1C4B47}
body[data-theme="hero"] .stage{background:radial-gradient(circle,rgba(16,22,51,.18) 2px,transparent 2.5px) 0 0/10px 10px,#FFD23F;border:3px solid #101633;box-shadow:5px 5px 0 #101633}
body[data-theme="hero"] .bubble{border:3px solid #101633;border-radius:22px}
body[data-theme="hero"] .bubble::before{border-right-color:#101633;left:-13px}
body[data-theme="pop"] .stage{background:radial-gradient(120px 160px at 60px 30%,rgba(255,62,165,.55),transparent 70%),radial-gradient(160px 120px at 90% 0%,rgba(62,231,255,.3),transparent 70%),#120822}
body[data-theme="space"] .stage{background:radial-gradient(90px 90px at 70px 70px,rgba(95,224,255,.25),transparent 70%),radial-gradient(1px 1px at 30% 20%,#fff,transparent),radial-gradient(1px 1px at 80% 70%,#fff,transparent),#0C1430;border:1px solid #2C3D7D}
body[data-theme="space"] .bubble{border-radius:6px;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
body[data-theme="army"] .stage{background:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 10px,transparent 10px 20px),#232A18;border:2px solid #4A5833}
body[data-theme="army"] .bubble{border-radius:2px;font-family:"Courier New",monospace;font-weight:700}
body[data-theme="football"] .stage{background:linear-gradient(transparent 49%,rgba(247,249,244,.5) 49% 51%,transparent 51%),radial-gradient(circle at 50% 50%,transparent 46px,rgba(247,249,244,.5) 46px 48px,transparent 48px),#13261A}

/* The child */
.me{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.me h1{line-height:1}
.badge{width:84px;height:84px}
.badge.sm{width:28px;height:28px;vertical-align:-7px}
.avatar{width:112px;height:124px;flex:none;display:block}
.avatar.big{width:min(220px,60vw);height:auto}
.avatar.tile{width:100%;height:auto;max-height:140px}
.rankline{font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meter{height:12px;border-radius:999px;background:rgba(127,127,127,.22);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent2);border-radius:999px;transition:width .6s}
body[data-theme="karate"] .meter{height:16px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
body[data-theme="karate"] .meter i{border-radius:2px;background:var(--belt,#f4f4f4)}

/* Wallet and goal tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.tile .num{font-size:44px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.tile .what{font-weight:700;color:var(--muted)}
.tile .go{margin-top:auto;font-weight:900;color:var(--accent)}
.nudge{display:flex;flex-direction:column;gap:5px;margin-top:2px}.nudge .nl{font-size:14px;font-weight:700;color:var(--muted);line-height:1.25}.nudge .nl b{color:var(--ink)}.nbar{display:block;height:8px;border-radius:999px;background:rgba(127,127,127,.22);overflow:hidden}.nbar i{display:block;height:100%;background:var(--accent2);border-radius:999px}
.weekstrip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 12px 0;font-size:14px;font-weight:800}.weekstrip .wl{opacity:.7;font-weight:700}.weekstrip span:not(.wl){background:rgba(0,0,0,.22);color:#fff;border-radius:999px;padding:3px 10px;backdrop-filter:blur(4px)}
.stars{display:flex;flex-wrap:wrap;gap:3px}
.stars i{font-style:normal;font-size:18px;line-height:1;color:rgba(127,127,127,.35)}
.stars i.on{color:var(--accent2)}
@media (max-width:420px){.tiles{grid-template-columns:1fr}}

/* Quest cards */
.quests{display:flex;flex-direction:column;gap:12px}
.quest{display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center;text-align:left;width:100%;padding:10px;
  background:var(--panel);color:var(--ink);border:var(--card-border);border-radius:var(--card-radius);box-shadow:var(--card-shadow)}
.quest .thumb{width:84px;height:84px;border-radius:calc(var(--card-radius) - 2px);object-fit:cover;background:rgba(127,127,127,.15);display:grid;place-items:center}
.quest .thumb svg{width:60px;height:72px}
.quest .t{font-weight:900;font-size:19px;line-height:1.2}
.quest .meta{font-size:14px;color:var(--muted);font-weight:700}
.seal{min-width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:17px;background:var(--accent);color:var(--accent-ink);padding:0 6px}
body[data-theme="karate"] .seal{border-radius:6px;transform:rotate(-4deg);box-shadow:inset 0 0 0 3px rgba(255,248,238,.5)}
body[data-theme="hero"] .seal{border:3px solid #101633;clip-path:polygon(50% 0,61% 30%,95% 22%,72% 50%,95% 78%,61% 70%,50% 100%,39% 70%,5% 78%,28% 50%,5% 22%,39% 30%)}
body[data-theme="army"] .seal{border-radius:4px}
.quest.waiting{opacity:.75}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.section-title .count{font-weight:900;opacity:.7}

/* Job screen: moves */
.hero-photo{width:100%;max-height:42vh;object-fit:cover;border-radius:var(--card-radius);background:rgba(127,127,127,.15);border:var(--card-border)}
.moves{display:flex;flex-direction:column;gap:12px}
.move{display:grid;grid-template-columns:88px 1fr;gap:4px 14px;align-items:center;background:var(--panel);color:var(--ink);border:var(--card-border);border-radius:var(--card-radius);
  box-shadow:var(--card-shadow);padding:12px;position:relative}
.move .fig{grid-row:1/4;width:88px;height:106px;color:var(--fig)}
.move .n{font-size:14px;font-weight:700;color:var(--muted)}
.move .name{font-family:var(--display);font-weight:var(--dweight);letter-spacing:var(--dspace);font-size:26px;line-height:1.05}
.move .what{display:flex;gap:10px;align-items:center;font-weight:700;font-size:18px}
.move .what button{flex:none}
.move .act{grid-column:1/-1;display:flex;justify-content:flex-end}
.move.now{outline:3px solid var(--accent2);outline-offset:2px}
.move.now .fig svg{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.move.done{opacity:.6}
.move.done .stamp{display:grid}
.stamp{display:none;position:absolute;right:14px;top:12px;place-items:center;width:64px;height:64px;border-radius:50%;border:3px solid var(--accent);color:var(--accent);
  font-family:var(--display);font-weight:var(--dweight);font-size:18px;transform:rotate(-12deg);background:color-mix(in srgb,var(--panel) 80%,transparent)}
body[data-theme="karate"] .stamp{border-radius:6px}
.play{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.play svg{width:22px;height:22px}
.hai{min-height:52px;padding:0 26px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.hai:disabled{opacity:.35;box-shadow:none}
.move.done .hai{background:transparent;color:var(--muted);box-shadow:none;border:1.5px solid var(--line);font-size:15px;min-height:40px}
.clock{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;text-align:center}
.notice{display:flex;gap:12px;align-items:center;font-weight:700}
.notice svg{width:26px;height:26px;flex:none}

/* Shop */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.reward{background:var(--panel);color:var(--ink);border:var(--card-border);border-radius:var(--card-radius);box-shadow:var(--card-shadow);padding:12px;display:flex;flex-direction:column;gap:10px;text-align:left}
.reward .ico{font-size:46px;line-height:1;height:96px;display:grid;place-items:center;background:rgba(127,127,127,.1);border-radius:calc(var(--card-radius) - 2px)}
.reward .n{font-weight:900;line-height:1.25;flex:1}
.reward .howlong{font-size:13px;font-weight:800;color:var(--muted);background:none;border:0;padding:0;text-align:left;text-decoration:underline;cursor:pointer}.reward.saving{outline:3px solid var(--accent2);outline-offset:2px}
.plan{width:100%;border-collapse:collapse;font-size:17px}.plan td{padding:7px 10px;border-bottom:2px solid rgba(127,127,127,.18)}.plan td:last-child{text-align:right;font-weight:900}.plan tr.hit td{color:var(--accent2);font-weight:900}
.freeideas{display:flex;flex-wrap:wrap;gap:8px}
.reward .rphoto{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:calc(var(--card-radius) - 2px);max-width:100%}

/* Style picker */
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.style{border-radius:16px;padding:14px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;text-align:left;border:3px solid transparent;position:relative;overflow:hidden}
.style.on{border-color:#fff;box-shadow:0 0 0 3px var(--accent2)}
.style .nm{font-size:26px;line-height:1}

.style .sub{font-weight:700;font-size:14px;opacity:.85}
.kidpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.kidpick button{border-radius:16px;padding:16px;min-height:150px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.kidpick .avatar{width:84px;height:93px}

/* Parent area: calm and neutral */
body.parent{--world:#F4EEE2;--bg:#F4EEE2;--panel:#FFFDF8;--ink:#221A13;--muted:#6F6253;--line:#E4D9C4;--accent:#1C4B47;--accent-ink:#fff;--accent2:#C98A1B;
  --display:"Nunito",system-ui,sans-serif;--dweight:900;--dspace:0;--card-radius:16px;--card-border:1px solid #D8DEE5;--card-shadow:0 1px 0 rgba(23,32,42,.04)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:4px}
.tab{padding:9px 16px;border-radius:999px;font-weight:700;white-space:nowrap;border:1.5px solid var(--line);background:var(--panel)}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.brandrow{display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px;color:var(--muted)}.brandrow i{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--ink)}
.today{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}.today .av{width:56px;height:62px}.today .badge.av{width:56px;height:56px}.today .nm{font-weight:900;font-size:19px;line-height:1.1}.today .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}.today .facts span{background:rgba(28,75,71,.08);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800}.today .facts span.hot{background:var(--warn);color:#fff}
.tab .n{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--warn);color:#fff;font-size:13px}
.jobcard{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;text-align:left;width:100%;background:var(--panel);border:var(--card-border);border-radius:var(--card-radius);padding:10px}
.thumb{width:72px;height:72px;border-radius:12px;object-fit:cover;background:rgba(127,127,127,.15)}
.jobcard .t{font-weight:900;font-size:18px}
.photo-slot{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:var(--card-radius);border:2px dashed var(--line);display:grid;place-items:center;overflow:hidden;background:var(--panel)}
.photo-slot img{width:100%;height:100%;object-fit:cover}
.retake{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px}
.pstep{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--bg)}
.rec{width:88px;height:88px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;margin:0 auto}
.rec svg{width:38px;height:38px}
.rec.on{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(194,53,43,.25)}}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;background:var(--panel)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair img{aspect-ratio:1;object-fit:cover;border-radius:12px;width:100%}
.ideas{display:flex;flex-wrap:wrap;gap:8px}
.ideas button{padding:7px 12px;border-radius:999px;background:var(--bg);border:1.5px dashed var(--line);font-weight:700;font-size:14px}

/* PIN */
.pin-dots{display:flex;gap:14px;justify-content:center}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--ink)}
.pin-dots i.on{background:var(--ink)}
.pinpad{display:grid;grid-template-columns:repeat(3,74px);gap:12px;justify-content:center}
.pinpad button{height:74px;border-radius:50%;background:var(--bg);font-size:28px;font-weight:900}

/* Overlays and camera */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,12,18,.72);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);color:var(--ink);border-radius:22px;padding:22px;width:min(520px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;border:var(--card-border)}
.cam{position:fixed;inset:0;z-index:55;background:#000;color:#fff;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.cam-top{display:flex;align-items:center;gap:12px;padding:12px 16px}
.cam-x{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:20px}
.cam-title{flex:1;font-weight:900;font-size:18px}
.cam-time{font-weight:900;color:#ff5a52;font-variant-numeric:tabular-nums}
.cam-view{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden}
.cam-view video{width:100%;height:100%;object-fit:cover}
.cam-view video.mirror{transform:scaleX(-1)}
.cam-msg{position:absolute;color:rgba(255,255,255,.7)}
.cam-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:20px 24px 28px;gap:16px}
.cam-side{justify-self:center;min-width:72px;height:44px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:15px;padding:0 16px}
.shutter{width:84px;height:84px;border-radius:50%;border:5px solid #fff;display:grid;place-items:center;background:transparent}
.shutter i{width:66px;height:66px;border-radius:50%;background:#fff;transition:all .2s}
.shutter.vid i{background:#ff3b30}
.shutter.rec i{width:30px;height:30px;border-radius:8px}
.shutter:active i{transform:scale(.9)}
.cam.flash .cam-view{animation:flash .25s}
@keyframes flash{0%{opacity:.2}100%{opacity:1}}
.media-box{width:100%;border-radius:12px;background:#000;max-height:50vh}
.ticon{width:100%;height:100%;display:grid;place-items:center;font-size:56px;background:rgba(127,127,127,.15)}
.ticon.big{height:auto;aspect-ratio:4/3;border-radius:12px;font-size:96px}
.tthumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#000;flex:none}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--panel);color:var(--ink);border:var(--card-border);border-radius:var(--card-radius);box-shadow:var(--card-shadow);padding:10px}
.tcard .t{font-weight:900}
.tmedia{position:relative;display:block;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:calc(var(--card-radius) - 2px);overflow:hidden;background:#000}
.tmedia video,.tmedia img{width:100%;height:100%;object-fit:cover}
.tplay{position:absolute;inset:0;display:grid;place-items:center;color:#fff}
.tplay svg{width:26px;height:26px;padding:13px 11px 13px 15px;box-sizing:content-box;border-radius:50%;background:rgba(0,0,0,.55);box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.wishbtn{display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.wplus{width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:32px;font-weight:900;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-edge)}
.wicons{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.wicons button{font-size:26px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--bg)}
.wicons button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.hday{font-weight:900;font-size:14px;color:var(--muted);margin-top:8px}
.hrow{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.hic{width:28px;text-align:center;flex:none}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.libcard{display:flex;align-items:center;gap:8px;padding:8px}
.libmain{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.libmain .thumb{width:56px;height:56px;flex:none}
.pstrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pstrip img{width:96px;height:96px;object-fit:cover;border-radius:10px;flex:none}
.pstrip.story figure{margin:0;flex:none;display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.pstrip.story img{width:120px;height:120px}
.backers{font-size:14px;font-weight:700;color:var(--muted)}
.hallstrip{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.hallstrip .grow{flex:1;min-width:0}
.celebrate{text-align:center}
.celebrate .big{font-size:clamp(30px,8vw,48px)}
.celebrate .mentor{width:120px;height:136px;margin:0 auto}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:70;background:#17202A;color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;max-width:90vw}
.empty{text-align:center;padding:26px 16px}

/* ===== v0.8 visual layer: game-quality worlds =====
   Each world: a saturated ground, warm paper (or deep glass) cards with a solid "lip",
   one hero accent and a complementary gold/cyan for rewards. */
body[data-theme="karate"]{--panel:#FFF7E8;--ink:#24170F;--muted:#7A6450;--line:#E6D3B0;--card-edge:#C9A86A;--accent:#1C4B47;--accent-edge:#0E2A27;--accent-ink:#FFF7E8;--accent2:#E8B04B;--on-bg:#FFF3DC;--fig:#24170F;
  background-color:#1C4B47;background-size:100px 50px;background-attachment:fixed;
  background-image:radial-gradient(circle at 100% 150%,#1C4B47 24%,#235E58 24% 28%,#1C4B47 28% 36%,#235E58 36% 40%,transparent 40%),
    radial-gradient(circle at 0 150%,#1C4B47 24%,#235E58 24% 28%,#1C4B47 28% 36%,#235E58 36% 40%,transparent 40%),
    radial-gradient(circle at 50% 100%,#235E58 10%,#1C4B47 10% 23%,#235E58 23% 30%,#1C4B47 30% 43%,#235E58 43% 50%,#1C4B47 50% 63%,#235E58 63% 71%,transparent 71%),
    radial-gradient(circle at 100% 50%,#235E58 5%,#1C4B47 5% 15%,#235E58 15% 20%,#1C4B47 20% 29%,#235E58 29% 34%,#1C4B47 34% 44%,#235E58 44% 49%,transparent 49%),
    radial-gradient(circle at 0 50%,#235E58 5%,#1C4B47 5% 15%,#235E58 15% 20%,#1C4B47 20% 29%,#235E58 29% 34%,#1C4B47 34% 44%,#235E58 44% 49%,transparent 49%)}
body[data-theme="army"]{--panel:#F1E7C8;--ink:#232A15;--muted:#5E5A40;--line:#D8C99C;--card-edge:#9C8A55;--accent:#E8742A;--accent-edge:#A24E14;--accent-ink:#1E1206;--accent2:#F2C14E;--on-bg:#F1E7C8;--fig:#232A15}
body[data-theme="hero"]{--panel:#FFFFFF;--ink:#101633;--muted:#4A5280;--line:#C9D0F0;--card-edge:#101633;--accent:#E5332A;--accent-edge:#8E1A14;--accent-ink:#FFFFFF;--accent2:#FFD23F;--on-bg:#FFFFFF;--fig:#101633;
  --world:radial-gradient(circle,rgba(255,255,255,.08) 2px,transparent 2.5px) 0 0/14px 14px,linear-gradient(#2338A8,#18267A)}
body[data-theme="pop"]{--panel:#FFF5FB;--ink:#2A0F45;--muted:#7A5A8E;--line:#EBD3F2;--card-edge:#B46CD0;--accent:#FF2E93;--accent-edge:#A3125C;--accent-ink:#FFFFFF;--accent2:#31D7F2;--on-bg:#FFF5FB;--fig:#FF2E93;
  --world:radial-gradient(50% 35% at 10% 0%,rgba(255,46,147,.45),transparent 70%),radial-gradient(50% 35% at 90% 5%,rgba(49,215,242,.35),transparent 70%),#2A0F45}
body[data-theme="space"]{--panel:#16224F;--ink:#EAF1FF;--muted:#9DB0E0;--line:#2B3C7A;--card-edge:#0A1238;--accent:#FF8A3D;--accent-edge:#A9501A;--accent-ink:#1A0C02;--accent2:#5FE0FF;--on-bg:#EAF1FF;--fig:#5FE0FF}
body[data-theme="football"]{--panel:#FFFFFF;--ink:#13261A;--muted:#4E6A57;--line:#D3E4D7;--card-edge:#14592C;--accent:#D62828;--accent-edge:#8E1414;--accent-ink:#FFFFFF;--accent2:#F2C14E;--on-bg:#FFFFFF;--fig:#13261A}
body.parent{--card-edge:#E4D9C4;--accent-edge:#0E2A27;--on-bg:#221A13}

.on-world{color:var(--on-bg)}
.section-title.on-world h2,.topbar .on-world h1,h1.on-world{text-shadow:0 2px 0 rgba(0,0,0,.25)}
body.parent .section-title.on-world h2,body.parent h1{text-shadow:none}

.panel,.quest,.move,.reward,.tcard{border:2px solid var(--card-edge);border-radius:20px;box-shadow:0 5px 0 var(--card-edge),0 18px 28px -18px rgba(0,0,0,.55)}
body.parent .panel,body.parent .jobcard{box-shadow:0 2px 0 var(--card-edge);border-width:1px}
.btn{border-radius:16px;box-shadow:0 5px 0 var(--accent-edge);letter-spacing:.01em}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-edge)}
.btn.ghost{background:var(--panel);border:2px solid var(--card-edge);box-shadow:0 4px 0 var(--card-edge)}
.btn.good{box-shadow:0 5px 0 #13542F}
.btn.bad{box-shadow:none}
.iconbtn{border:2px solid var(--card-edge);box-shadow:0 3px 0 var(--card-edge)}
.hai{border-radius:16px;box-shadow:0 5px 0 var(--accent-edge)}
.hai:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-edge)}
.play{box-shadow:0 3px 0 var(--accent-edge)}

/* Stage: the master stands in their world */
.stage{min-height:214px;border-radius:24px;border:3px solid var(--card-edge);box-shadow:0 6px 0 var(--card-edge),0 22px 30px -20px rgba(0,0,0,.6);background:#000;padding:14px 14px 0;isolation:isolate}
body[data-theme] .stage{background:#000}
.stage .scene{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.stage .mentor{width:130px;height:148px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.stage .who{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.bubble{border:2px solid rgba(0,0,0,.12);border-radius:18px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
body[data-theme="karate"] .bubble{border-left:5px solid var(--accent);border-radius:6px 18px 18px 6px}
body[data-theme="hero"] .stage{background:#000;border:3px solid #101633;box-shadow:6px 6px 0 #101633}

/* Player card overlaps the stage */
.me.player{position:relative;z-index:2;margin:-46px 12px 0;background:var(--panel);color:var(--ink);border:2px solid var(--card-edge);border-radius:20px;padding:14px;box-shadow:0 5px 0 var(--card-edge),0 18px 28px -18px rgba(0,0,0,.55)}
.me.player h1{font-size:clamp(28px,7vw,40px)}
.me.player .avatar{width:96px;height:106px}
.meter{height:18px;background:rgba(0,0,0,.14);box-shadow:inset 0 2px 3px rgba(0,0,0,.2);border-radius:999px}
.meter i{background:linear-gradient(var(--accent2),color-mix(in srgb,var(--accent2) 70%,#000));box-shadow:inset 0 3px 0 rgba(255,255,255,.45)}
body[data-theme="karate"] .meter{border-radius:999px}
body[data-theme="karate"] .meter i{border-radius:999px;background:linear-gradient(var(--belt,#f4f4f4),color-mix(in srgb,var(--belt,#f4f4f4) 75%,#000))}

/* Coins and seals */
.coin{display:inline-block;width:34px;height:34px;vertical-align:-6px;margin-right:6px}
.tile .num{display:flex;align-items:center;font-family:var(--display);font-weight:var(--dweight)}
.seal{width:58px;height:58px;min-width:58px;border-radius:50%;font-family:var(--display);font-weight:var(--dweight);font-size:19px;color:#3A2600;
  background:radial-gradient(circle at 35% 30%,#FFF1BF,var(--accent2) 62%,color-mix(in srgb,var(--accent2) 70%,#000) 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.45),0 3px 0 rgba(0,0,0,.25);transform:none;clip-path:none;border:0}
body[data-theme="karate"] .seal,body[data-theme="army"] .seal,body[data-theme="hero"] .seal{border-radius:50%;transform:none;clip-path:none;border:0}
.quest .thumb{border-radius:14px;background:color-mix(in srgb,var(--accent2) 22%,var(--panel))}
.quest .t{font-size:20px}
.tile .what{color:var(--muted)}
.tile .go{color:var(--accent);font-weight:900}
.stars i{font-size:20px;text-shadow:0 1px 0 rgba(0,0,0,.15)}

@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes rise{0%{transform:translateY(18px);opacity:0}100%{transform:none;opacity:1}}
.stage .mentor-btn{animation:rise .5s ease-out both}
.stage .bubble{animation:pop .45s .25s ease-out both}
.updbar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:60;display:flex;gap:10px;align-items:center;background:#1d2a2f;color:#fff;padding:12px 12px 12px 16px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:15px;line-height:1.3}
.updbar .iconbtn{background:transparent;color:#fff;border:0;width:36px;height:36px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const DB=(()=>{let p;function open(){return p||(p=new Promise((res,rej)=>{const r=indexedDB.open("tq_media",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("b");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
  function tx(mode,fn){return open().then(db=>new Promise((res,rej)=>{const t=db.transaction("b",mode);const q=fn(t.objectStore("b"));
    t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}))}
  return{put:(id,blob)=>tx("readwrite",s=>s.put(blob,id)),get:id=>tx("readonly",s=>s.get(id)),del:id=>tx("readwrite",s=>s.delete(id))}})();
const urlCache={};
async function mediaURL(id){if(!id)return null;if(urlCache[id])return urlCache[id];const b=await DB.get(id);if(!b)return null;return urlCache[id]=URL.createObjectURL(b)}

const BLANK="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
const thumbCache={};
async function thumbURL(id){if(thumbCache[id])return thumbCache[id];const tid="th_"+id;
  const have=await DB.get(tid).catch(()=>null);if(have)return thumbCache[id]=URL.createObjectURL(have);
  const u=await mediaURL(id);if(!u)return null;
  const blob=await new Promise(res=>{const v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="auto";let done=false;
    const fin=b=>{if(done)return;done=true;v.removeAttribute("src");v.load();res(b)};setTimeout(()=>fin(null),8000);
    v.onloadeddata=()=>{const d=isFinite(v.duration)?v.duration:1;v.currentTime=Math.min(0.6,d/3)};
    v.onseeked=()=>{try{const w=480,h=Math.round(w*(v.videoHeight||360)/(v.videoWidth||480));const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(v,0,0,w,h);c.toBlob(b=>fin(b),"image/jpeg",.8)}catch(e){fin(null)}};
    v.onerror=()=>fin(null);v.src=u});
  if(!blob)return null;DB.put(tid,blob).catch(()=>{});return thumbCache[id]=URL.createObjectURL(blob)}
async function hydrate(root){for(const el of root.querySelectorAll("[data-media]")){const tag=el.tagName.toLowerCase();
  if(tag==="video"&&!el.hasAttribute("controls")){el.poster=BLANK;const id=el.dataset.media;thumbURL(id).then(t=>{if(t)el.poster=t});continue}
  const u=await mediaURL(el.dataset.media);if(!u)continue;
  if(tag==="image")el.setAttribute("href",u);else el.src=u}}

/* ---------- Alert sounds: one for each world, so you can tell who it is without looking ---------- */
function ac(){actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume().catch(()=>{});return actx}
function env(a,t,peak,att,dec){const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+att+dec);return g}
function noiseBuf(a){if(noiseBuf.b)return noiseBuf.b;const n=a.sampleRate*1.5,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return noiseBuf.b=b}
function noise(a,t,dur,type,freq,q,vol,out){const s=a.createBufferSource();s.buffer=noiseBuf(a);const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=env(a,t,vol,.005,dur);s.connect(f).connect(g).connect(out);s.start(t);s.stop(t+dur+.05)}
function osc(a,t,{f,type="sine",vol=.2,att=.005,dec=.4,glide=null,out}){const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);
  if(glide)o.frequency.exponentialRampToValueAtTime(glide[0],t+glide[1]);const g=env(a,t,vol,att,dec);o.connect(g).connect(out||a.destination);o.start(t);o.stop(t+att+dec+.05);return o}
const SOUNDS={
  /* Chinese opera gong: a soft mallet hit, a shimmer of clashing partials, and the pitch bending up as it rings */
  gong(a,t){const m=a.createGain();m.gain.value=.9;m.connect(a.destination);
    noise(a,t,.18,"lowpass",900,.7,.35,m);
    [[1,.32,4.2],[1.47,.18,3.2],[2.09,.14,2.6],[2.56,.10,2.1],[3.01,.08,1.7],[3.9,.05,1.3],[4.62,.04,1]].forEach(([r,v,d],i)=>{
      const f=180*r;osc(a,t,{f,vol:v,att:.012+i*.004,dec:d,glide:[f*1.09,1.1],out:m})})},
  bugle(a,t){const lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2200;lp.connect(a.destination);
    [[392,0,.12],[523,.15,.12],[659,.3,.12],[784,.45,.5]].forEach(([f,w,d])=>{osc(a,t+w,{f,type:"sawtooth",vol:.13,att:.02,dec:d,out:lp});osc(a,t+w,{f:f*2,type:"square",vol:.02,att:.02,dec:d,out:lp})})},
  zap(a,t){osc(a,t,{f:280,type:"square",vol:.1,att:.01,dec:.3,glide:[1400,.28]});[1568,2093,2637].forEach((f,i)=>osc(a,t+.3+i*.07,{f,vol:.12,dec:.35}))},
  sparkle(a,t){[[1047,0],[1319,.08],[1568,.16],[2093,.24]].forEach(([f,w])=>{osc(a,t+w,{f,type:"triangle",vol:.16,dec:.5});osc(a,t+w+.32,{f,type:"triangle",vol:.05,dec:.4})})},
  sonar(a,t){[0,.55].forEach((w,i)=>{osc(a,t+w,{f:1320,vol:i?.07:.2,att:.004,dec:1.1,glide:[1180,1]});osc(a,t+w,{f:2640,vol:i?.015:.04,dec:.6})})},
  /* referee's whistle: short, short, long — a high note with the pea rattling inside it */
  whistle(a,t){[[0,.13],[.2,.13],[.42,.55]].forEach(([w,d])=>{const o=a.createOscillator();o.type="sine";o.frequency.value=2900;
      const g=a.createGain(),trem=a.createOscillator(),tg=a.createGain();trem.frequency.value=34;tg.gain.value=.06;trem.connect(tg).connect(g.gain);
      g.gain.setValueAtTime(.0001,t+w);g.gain.exponentialRampToValueAtTime(.1,t+w+.02);g.gain.setValueAtTime(.1,t+w+d);g.gain.exponentialRampToValueAtTime(.0001,t+w+d+.05);
      o.connect(g).connect(a.destination);o.start(t+w);trem.start(t+w);o.stop(t+w+d+.08);trem.stop(t+w+d+.08);
      noise(a,t+w,d,"bandpass",3000,6,.05,a.destination)})},
  bell(a,t){[[880,0],[698,.42]].forEach(([f,w])=>{osc(a,t+w,{f,vol:.22,dec:1.2});osc(a,t+w,{f:f*2.76,vol:.04,dec:.5})})},
  till(a,t){noise(a,t,.06,"highpass",3000,.7,.18,a.destination);[[1976,.05],[2637,.13]].forEach(([f,w])=>{osc(a,t+w,{f,vol:.16,dec:.7});osc(a,t+w,{f:f*1.5,vol:.04,dec:.4})})},
  twinkle(a,t){[1319,1568,2093,2637,3136].forEach((f,i)=>osc(a,t+i*.06,{f,type:"triangle",vol:.12,dec:.45}))}
};
const WORLD_SOUND={karate:"gong",army:"bugle",hero:"zap",pop:"sparkle",space:"sonar",football:"whistle"};
const SOUND_NAMES={world:"Each child's world",gong:"Gong",bugle:"Bugle",whistle:"Ref's whistle",zap:"Power-up",sparkle:"Pop sparkle",sonar:"Sonar ping",bell:"Doorbell",off:"Silent"};
function playSound(name){const f=SOUNDS[name];if(!f)return;try{const a=ac();f(a,a.currentTime+.03)}catch(e){}}
/* what this phone plays when something happens on another phone */
function sfxAlert(k,kind){const pick=S.alertSound||"world";if(pick==="off")return;
  const main=pick==="world"?(WORLD_SOUND[k&&k.theme]||"bell"):pick;
  if(kind==="buy")playSound("till");else playSound(main);
  if(kind==="star")setTimeout(()=>playSound("twinkle"),pick==="world"&&main==="gong"?900:600);
  try{navigator.vibrate&&navigator.vibrate(kind==="done"?[120,80,120]:[90])}catch(e){}}

/* ---------- Confetti ---------- */
function confetti(k){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#confetti"),x=c.getContext("2d");c.hidden=false;c.width=innerWidth;c.height=innerHeight;
  const cs=getComputedStyle(document.body);const cols=[cs.getPropertyValue("--accent"),"#ffffff",cs.getPropertyValue("--good"),"#ff5f6d","#5fb4ff"];
  const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6.28,s:6+Math.random()*8,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;(function step(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.r+=.15;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(++f<170)requestAnimationFrame(step);else{c.hidden=true}})()}

/* ---------- Navigation ---------- */
let stack=[];let view=null;
function go(name,args={},replace=false){if(view&&!replace)stack.push(view);view={name,args};render()}
function back(){if(overlayClose()){return true}if(!stack.length)return false;view=stack.pop();render();return true}
window.appBack=()=>back()?"handled":"exit";
function home(){setTimeout(()=>window.__checkImport&&window.__checkImport(),400);stack=[];const kids=S.kids;
  if(!S.pin||!kids.length){view={name:"welcome",args:{}}}
  else if(kids.length===1){view={name:"hq",args:{kid:kids[0].id}}}
  else{view={name:"pick",args:{}}}
  render()}

function setBodyTheme(k,parent){document.body.classList.toggle("parent",!!parent);document.body.dataset.theme=parent?"":(k?k.theme:"")}

const VIEWS={};
async function render(){stopTimer();const v=VIEWS[view.name];const app=$("#app");app.innerHTML=await v(view.args);await hydrate(app);window.scrollTo(0,0);if(v.after)v.after(view.args)}

/* ---------- Overlays ---------- */
let overlayEl=null,overlayOnClose=null;
function overlay(html,onClose){overlayClose();overlayEl=document.createElement("div");overlayEl.className="overlay";overlayEl.innerHTML=`<div class="sheet">${html}</div>`;
  document.body.appendChild(overlayEl);overlayOnClose=onClose;hydrate(overlayEl);return overlayEl}
function overlayClose(){if(!overlayEl)return false;overlayEl.remove();overlayEl=null;const f=overlayOnClose;overlayOnClose=null;if(f)f();return true}

function pinPad(title,sub,onDone){let val="";
  const draw=()=>{$("#pd").innerHTML=[0,1,2,3].map(i=>`<i class="${i<val.length?"on":""}"></i>`).join("")};
  const el=overlay(`<div class="stack" style="align-items:center;text-align:center"><h2 class="display">${esc(title)}</h2><p class="muted" style="margin:0">${esc(sub)}</p>
    <div class="pin-dots" id="pd"></div><div class="pinpad">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(n=>n===""?"<span></span>":`<button data-k="${n}" aria-label="${n==="⌫"?"Delete":n}">${n}</button>`).join("")}</div>
    <button class="btn ghost small" data-k="x">Cancel</button></div>`);
  draw();
  el.addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b)return;const k=b.dataset.k;

/* ---------- Camera (full screen, photo or video) ---------- */
let camStream=null,camRec=null;
function stopCam(){if(camRec&&camRec.state==="recording"){camRec.onstop=null;camRec.stop()}camRec=null;if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}}
function takePhoto(cb,title="Take a photo"){capture({mode:"photo",title},cb)}
function capture({mode="photo",title="Take a photo",facing="environment"},cb){
  const pickFile=()=>{const f=$("#filepick");f.accept=mode==="video"?"video/*":"image/*";f.value="";
    f.onchange=async()=>{const file=f.files[0];if(!file)return;cb(await putMedia(mode==="video"?file:await shrink(file)),mode)};f.click()};
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){pickFile();return}
  overlayClose();overlayEl=document.createElement("div");overlayEl.className="cam";overlayOnClose=stopCam;
  overlayEl.innerHTML=`<div class="cam-top"><button class="cam-x" data-close aria-label="Close">✕</button><span class="cam-title">${esc(title)}</span><span class="cam-time" id="camtime"></span></div>
    <div class="cam-view"><video id="cv" playsinline autoplay muted></video><div class="cam-msg" id="cammsg">Starting camera…</div></div>
    <div class="cam-bar"><button class="cam-side" id="galbtn" aria-label="Choose from gallery">${mode==="video"?"Videos":"Photos"}</button>
      <button class="shutter ${mode==="video"?"vid":""}" id="snapbtn" aria-label="${mode==="video"?"Start recording":"Take photo"}"><i></i></button>
      <button class="cam-side" id="flipbtn" aria-label="Switch camera">Flip</button></div>`;
  document.body.appendChild(overlayEl);const el=overlayEl;
  const v=el.querySelector("#cv"),msg=el.querySelector("#cammsg"),shut=el.querySelector("#snapbtn"),timeEl=el.querySelector("#camtime");
  const start=()=>{if(camStream)camStream.getTracks().forEach(t=>t.stop());
    navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280}},audio:mode==="video"}).then(s=>{camStream=s;v.srcObject=s;msg.hidden=true;v.classList.toggle("mirror",facing==="user")})
      .catch(()=>{overlayClose();pickFile()})};
  start();
  el.querySelector("#galbtn").onclick=()=>{overlayClose();pickFile()};
  el.querySelector("#flipbtn").onclick=()=>{if(camRec)return;facing=facing==="user"?"environment":"user";start()};
  shut.onclick=()=>{if(!v.videoWidth)return;
    if(mode==="photo"){const c=document.createElement("canvas");const sc=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight));
      c.width=v.videoWidth*sc;c.height=v.videoHeight*sc;c.getContext("2d").drawImage(v,0,0,c.width,c.height);
      el.classList.add("flash");c.toBlob(async b=>{overlayClose();cb(await putMedia(b),"photo")},"image/jpeg",.82);return}
    if(camRec&&camRec.state==="recording"){camRec.stop();return}
    const chunks=[];let opts={videoBitsPerSecond:1500000};try{camRec=new MediaRecorder(camStream,opts)}catch(e){camRec=new MediaRecorder(camStream)}
    camRec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    camRec.onstop=async()=>{clearInterval(t);const b=new Blob(chunks,{type:(camRec&&camRec.mimeType)||"video/webm"});camRec=null;overlayClose();cb(await putMedia(b),"video")};
    camRec.start(500);shut.classList.add("rec");shut.setAttribute("aria-label","Stop recording");const t0=Date.now();
    const t=setInterval(()=>{const s=(Date.now()-t0)/1000;timeEl.textContent="● "+fmt(s);if(s>=30&&camRec)camRec.stop()},250)};
}
function shrink(file){return new Promise(res=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,1280/Math.max(img.width,img.height));const c=document.createElement("canvas");
  c.width=img.width*sc;c.height=img.height*sc;c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);c.toBlob(b=>res(b||file),"image/jpeg",.82)};
  img.onerror=()=>res(file);img.src=URL.createObjectURL(file)})}

/* ---------- Voice recorder ---------- */
function stepComposer(){let rec=null,chunks=[],blob=null,stream=null,t0=0,tick=null;
  const el=overlay(`<div class="stack"><h2 class="display">Add a step</h2>
    <p class="muted" style="margin:0">Say exactly what goes where, e.g. "Put all the Lego in the red box under the window."</p>
    <button class="rec" id="recbtn" aria-label="Record">${IC.mic}</button><div id="rect" class="muted" style="text-align:center">Tap to record</div>
    <button class="btn ghost small" id="replay" hidden>${IC.play} Play back</button>
    <label class="label" for="steptext">Words on screen (optional, read aloud if there's no recording)</label>
    <input id="steptext" maxlength="80" placeholder="Lego in the red box">
    <div class="row"><button class="btn" id="stepsave">Add step</button><button class="btn ghost" data-close>Cancel</button></div></div>`,()=>{if(stream)stream.getTracks().forEach(t=>t.stop());clearInterval(tick)});
  const btn=el.querySelector("#recbtn"),lab=el.querySelector("#rect"),rp=el.querySelector("#replay");
  btn.onclick=async()=>{
    if(rec&&rec.state==="recording"){rec.stop();return}
    try{stream=stream||await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){lab.textContent="Microphone not available. Type the words instead.";return}
    chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{blob=new Blob(chunks,{type:rec.mimeType||"audio/webm"});btn.classList.remove("on");btn.innerHTML=IC.mic;clearInterval(tick);lab.textContent="Recorded. Tap the mic to redo it.";rp.hidden=false};
    rec.start();t0=Date.now();btn.classList.add("on");btn.innerHTML=IC.stop;rp.hidden=true;
    tick=setInterval(()=>{const s=(Date.now()-t0)/1000;lab.textContent="Recording "+fmt(s)+" · tap to stop";if(s>45)rec.stop()},250)};
  rp.onclick=()=>{if(blob){if(curAudio)curAudio.pause();curAudio=new Audio(URL.createObjectURL(blob));curAudio.play()}};
  el.querySelector("#stepsave").onclick=async()=>{if(rec&&rec.state==="recording"){toast("Stop recording first");return}
    const text=el.querySelector("#steptext").value.trim();if(!blob&&!text){toast("Record a voice note or type some words");return}
    const step={id:uid(),text,audio:blob?await putMedia(blob):null};draft.steps.push(step);draft._new.push(step.audio);overlayClose();render()}}

/* ---------- Points and stars are a log of entries, so phones can merge without losing or doubling anything ---------- */
function recalc(k,quiet){const L=k.ledger||[];let d=0,e=0,st=0;const gid=k.goal&&k.goal.id;
  let openE=0;for(const x of L){d+=x.d||0;if(x.why==="start")openE=Math.max(openE,x.e||0);else e+=x.e||0;if(gid&&x.g===gid)st+=x.s||0}
  k.credits=d;k.earned=Math.max(0,openE+e);
  if(k.goal){k.goal.count=Math.max(0,st);const hit=k.goal.count>=k.goal.target;if(hit&&!k.goal.done){k.goal.done=true;if(!quiet)k.goalHit=true}else if(!hit)k.goal.done=false}}
function post(k,{d=0,e=0,s=0,why="",id=null}){k.ledger=k.ledger||[];if(id&&k.ledger.some(x=>x.id===id))return;k.ledger.push({id:id||"e"+uid(),t:Date.now(),d,e,s,g:s&&k.goal?k.goal.id:null,why,by:S.device});recalc(k)}
/* Wall of Fame wins rebuilt from the history (ids come from the history entry, so every phone makes the same ones and nothing doubles) */
function fixTrophies(k){k.trophies=k.trophies||[];k.tGone=k.tGone||[];const gone=new Set(k.tGone);
  const near=(t,title,at)=>t.title===title&&Math.abs((t.at||0)-(at||0))<15*60000;
  k.trophies=k.trophies.filter(t=>!gone.has(t.id));
  const real=k.trophies.filter(t=>!String(t.id).startsWith("L"));
  k.trophies=k.trophies.filter(t=>!String(t.id).startsWith("L")||!real.some(r=>near(r,t.title,t.at)));
  for(const e of (k.ledger||[])){const w=String(e.why||"");const job=w.startsWith("job "),star=w.startsWith("star ");if(!job&&!star)continue;
    const id="L"+e.id,title=w.slice(job?4:5).trim()||(job?T(k).job:"A star");if(gone.has(id)||k.trophies.some(t=>t.id===id||near(t,title,e.t)))continue;
    k.trophies.push({id,title,type:job?"tidy":null,media:null,kind:null,at:e.t||0,amt:e.d||0,star:star})}
  k.trophies.sort((a,b)=>(b.at||0)-(a.at||0))}
/* what happened in the last 7 days, and the treat within reach */
function weekOf(k){const since=Date.now()-7*86400000;let wins=0,stars=0,treats=0;for(const e of (k.ledger||[])){if((e.t||0)<since)continue;const w=String(e.why||"");if(w.startsWith("job "))wins++;if(w.startsWith("star "))stars+=e.s||0;if(w.startsWith("buy "))treats++}return {wins,stars,treats}}
/* Saving up: how long something takes at the child's own pace, so they can see what things are worth.
   Pace = points earned over the last fortnight (not counting the starting balance), or their daily jobs if they're new, or 5 a day. */
function pace(k){const day=86400000,now=Date.now(),since=now-14*day;let pts=0,first=now;
  for(const e of (k.ledger||[])){if((e.t||0)<since||String(e.why||"")==="start"||(e.d||0)<=0)continue;pts+=e.d;first=Math.min(first,e.t||now)}
  if(pts>0){const days=Math.min(14,Math.max(3,Math.ceil((now-first)/day)));return {n:Math.max(1,Math.round(pts/days)),from:"pace"}}
  const daily=S.jobs.filter(j=>j.kid===k.id&&j.repeat).reduce((a,j)=>a+(j.credits||0),0);if(daily>0)return {n:daily,from:"daily"};return {n:5,from:"guess"}}
function perJob(k){const xs=[];for(const e of (k.ledger||[]))if(String(e.why||"").startsWith("job ")&&(e.d||0)>0)xs.push(e.d);
  if(!xs.length)for(const j of S.jobs)if(j.kid===k.id&&j.credits)xs.push(j.credits);return xs.length?Math.max(1,Math.round(xs.reduce((a,b)=>a+b,0)/xs.length)):5}
function savePlan(k,r){const need=Math.max(0,r.cost-(k.credits||0)),p=pace(k),days=need?Math.ceil(need/p.n):0,d=new Date();d.setHours(12,0,0,0);
  const when=new Date(+d+days*86400000),wd=x=>x.toLocaleDateString("en-GB",{weekday:"long"}),dm=x=>x.toLocaleDateString("en-GB",{day:"numeric",month:"long"});
  return {need,pace:p,days,when,whenText:days===0?"now":days===1?"tomorrow":days<7?wd(when):wd(when)+" "+dm(when),jobs:need?Math.ceil(need/perJob(k)):0}}
function savingFor(k){const n=k.saving&&k.saving.name;return n?S.rewards.find(r=>r.name===n)||null:null}
function nextTreat(k){const rs=S.rewards.filter(r=>r.cost>0);if(!rs.length)return null;const can=rs.filter(r=>r.cost<=k.credits).sort((a,b)=>b.cost-a.cost)[0];
  if(can)return {r:can,have:true};const nx=rs.filter(r=>r.cost>k.credits).sort((a,b)=>a.cost-b.cost)[0];return nx?{r:nx,have:false,need:nx.cost-k.credits}:null}

const POSTER={
  karate:{bg:"#1C4B47",panel:"#FFF7E8",ink:"#24170F",muted:"#7A6450",accent:"#B8862F",gold:"#E8B04B",title:"#FFF3DC",font:"800 {s}px Shippori, 'Noto Serif JP', Georgia, serif"},

  pop:{bg:"#2A0F45",panel:"#FFF5FB",ink:"#2A0F45",muted:"#7A5A8E",accent:"#FF2E93",gold:"#31D7F2",title:"#FFF5FB",font:"{s}px Bungee, Impact, sans-serif"},
  space:{bg:"#070B1D",panel:"#16224F",ink:"#EAF1FF",muted:"#9DB0E0",accent:"#FF8A3D",gold:"#5FE0FF",title:"#EAF1FF",font:"700 {s}px Orbitron, 'Trebuchet MS', sans-serif"},
  football:{bg:"#1E7B3E",panel:"#FFFFFF",ink:"#13261A",muted:"#4E6A57",accent:"#D62828",gold:"#F2C14E",title:"#FFFFFF",font:"{s}px Bebas, Impact, sans-serif"}};
const MONTH_LINE={karate:"A month of training, {name}. Your belt grows heavier.",army:"Outstanding month, {name}. The whole squad is proud.",hero:"The city is safer because of you, {name}.",

const Upd=(()=>{let bar=null,info=null;
  function el(html){if(!bar){bar=document.createElement("div");bar.className="updbar";document.body.appendChild(bar)}bar.innerHTML=html;return bar}
  function hide(){if(bar){bar.remove();bar=null}}
  window.__onUpdate=o=>{if(!o||!o.versionCode||!o.mine||o.versionCode<=o.mine)return;info=o;
    el(`<span class="grow"><b>New update ready</b><br><span style="opacity:.85">Tidy Quest ${esc(String(o.name||""))}. Everything stays as it is.</span></span><button class="btn small" id="updgo">Update</button><button class="iconbtn" id="updx" aria-label="Later">✕</button>`);
    bar.querySelector("#updgo").onclick=go;bar.querySelector("#updx").onclick=hide};
  function go(){const b=bridge();if(!b||!b.installUpdate)return;el(`<span class="grow"><b>Getting the update…</b></span>`);b.installUpdate()}
  window.__onUpdateStep=(step,pct)=>{
    if(step==="allow")el(`<span class="grow"><b>One-time step:</b> switch on <b>Allow from this source</b>, then come back and tap Update.</span><button class="btn small" id="updgo">Update</button>`).querySelector("#updgo").onclick=go;
    else if(step==="progress")el(`<span class="grow"><b>Downloading update… ${pct}%</b></span>`);
    else if(step==="install")el(`<span class="grow"><b>Tap Update on the next screen.</b> Tidy Quest restarts with everything kept.</span><button class="iconbtn" id="updx" aria-label="Close">✕</button>`).querySelector("#updx").onclick=hide;
    else if(step==="fail")el(`<span class="grow"><b>The update didn't download.</b> Check the internet and try again.</span><button class="btn small" id="updgo">Try again</button>`).querySelector("#updgo").onclick=go};
  function check(){const b=bridge();if(b&&b.checkUpdate)try{b.checkUpdate()}catch(e){}}
  return {check}})();

  el.querySelector("#sendc").onclick=()=>{if(amt<1||amt>k.credits)return;post(k,{d:-amt,why:"moved"});
    const rec={n:d.n,to:d.from,kid:d.kid,name:k.name,amt,at:Date.now()};S.sent.push(rec);if(S.sent.length>50)S.sent.shift();save();overlayClose();render();showGive(rec)}}
function showGive(rec){showQR(packQR({t:"give",from:S.device,to:rec.to,n:rec.n,kid:rec.kid,name:rec.name,amt:rec.amt}),`${rec.amt} credits for ${rec.name}`,"Now scan this on the tablet that asked for them.")}
function acceptCredits(d){
  if(d.to!==S.device){toast("This transfer was made for a different tablet.");return}
  if(S.usedIn.includes(d.n)){toast("This transfer has already been added.");return}
  const p=S.pendingIn[d.n];if(!p){toast("This tablet didn't ask for that transfer.");return}
  const k=kid(p.kid);if(!k){toast("That child isn't on this tablet any more.");return}
  post(k,{d:d.amt,why:"moved in"});delete S.pendingIn[d.n];S.usedIn.push(d.n);if(S.usedIn.length>200)S.usedIn.shift();save();overlayClose();render();sfxFanfare(k);confetti(k);
  overlay(`<div class="stack" style="text-align:center;align-items:center"><h2 class="display">+${d.amt} for ${esc(k.name)}</h2><p style="margin:0">${esc(k.name)} now has ${k.credits} credits on this tablet.</p><button class="btn" data-close>Done</button></div>`)}
Object.assign(ACT,{
  sendKid(b){const k=kid(b.dataset.id);const stars=k.goal?Math.min(k.goal.count||0,k.goal.target):0;
    const el=overlay(`<div class="stack"><h2 class="display">Send ${esc(k.name)}</h2>
      <p style="margin:0">This makes one file with ${esc(k.name)}'s picture, rank, goal and ${(k.trophies||[]).length} trophies.</p>
      <p style="margin:0">Both phones keep everything. When the other phone opens it, it catches up with ${esc(k.name)}'s points, stars and trophies without counting anything twice. Send one back the other way any time.</p>
      <div class="row"><button class="btn" id="dosend">Make the file and send</button><button class="btn ghost" data-close>Cancel</button></div></div>`);
    el.querySelector("#dosend").onclick=async()=>{const btn=el.querySelector("#dosend");btn.disabled=true;btn.textContent="Packing…";
      try{const text=await buildKidFile(k);const name=`TidyQuest-${k.name.replace(/[^A-Za-z0-9]+/g,"")}-${today()}.tqkid.json`;
        const ok=await shareFile(name,text);if(!ok){btn.disabled=false;btn.textContent="Make the file and send";toast("Couldn't make the file. Try again.");return}
        overlayClose();toast(`${k.name}'s file is ready to send`)}
      catch(e){btn.disabled=false;btn.textContent="Make the file and send";toast("Couldn't make the file. Try again.")}}},
  addWish(b){wishSheet(kid(b.dataset.id))},
  wishYes(b){const w=S.wishes.find(x=>x.id===b.dataset.id);if(!w)return;const name=($("#wn-"+w.id).value||"").trim()||w.name||"New reward";const cost=Math.max(1,Math.min(999,parseInt($("#wc-"+w.id).value)||10));
    S.rewards.push({id:uid(),icon:w.icon||"⭐",name,cost,photo:w.photo||null,by:w.kid,at:Date.now()});S.shopAt=Date.now();S.wishes=S.wishes.filter(x=>x!==w);S.wishDone.push(w.id);const k=kid(w.kid);
    if(k){k.wishNews={name,cost}}save();render();toast(`${name} is in the shop for ${cost}`)},
  wishNo(b){const w=S.wishes.find(x=>x.id===b.dataset.id);if(!w)return;delMedia(w.photo);S.wishes=S.wishes.filter(x=>x!==w);S.wishDone.push(w.id);save();render();toast("Wish removed")},
  resend(){try{bridge().fileReshare("Send "+S.lastSend.file)}catch(e){toast("Couldn't find the file. Make a new one.")}},
  undoSend(){const L=S.lastSend;confirmSheet("Put the points back?",`Only do this if the file was never opened on the other phone, or ${L.name} gets them twice.`,()=>{const k=kid(L.kid);
    if(k){k.credits+=L.credits;if(k.goal&&!k.goal.done)k.goal.count=Math.min(k.goal.target,(k.goal.count||0)+L.stars)}delete S.lastSend;save();render();toast("Points put back")},"Put them back","Cancel")},
  receiveFile(){const f=$("#filepick");f.accept=".json,.tqkid,application/json,text/plain,*/*";f.value="";
    f.onchange=async()=>{const file=f.files[0];f.accept="image/*";if(!file)return;toast("Opening the file…");importKidFile(await file.text())};f.click()},
  scanAny(){scanQR(handleCode)},
  showSetup(){showQR(setupCode(),"Family setup","On the other tablet: Grown-ups → Link tablets → Scan a code.")},
  receiveCredits(b){const k=kid(b.dataset.id);const el=showQR(receiveCode(k),`Receive credits for ${k.name}`,"1. Scan this on the other tablet (Link tablets → Scan a code). 2. Then scan the code it shows back.",
    `<button class="btn" id="scanback">${IC.cam} Scan their code</button>`);
    el.querySelector("#scanback").onclick=()=>{overlayClose();scanQR(handleCode)}}
});
function keepTitle(){const t=$("#dtitle");if(t&&draft)draft.title=t.value.trim()}
function confirmSheet(title,sub,yes,label="Yes, delete",keep="Keep it"){overlay(`<div class="stack"><h2 class="display">${esc(title)}</h2><p class="muted" style="margin:0">${esc(sub)}</p>
  <div class="row"><button class="btn bad" id="cyes">${esc(label)}</button><button class="btn ghost" data-close>${esc(keep)}</button></div></div>`).querySelector("#cyes").onclick=()=>{overlayClose();yes()}}

document.addEventListener("click",e=>{
  if(e.target.closest("[data-close]")){overlayClose();return}
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b)});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.rw){const r=S.rewards.find(x=>x.id===t.dataset.id);if(!r)return;if(t.dataset.rw==="price"){const v=parseFloat(String(t.value).replace(/[£,\s]/g,""));if(v>0)r.price=Math.round(v*100)/100;else delete r.price}else r[t.dataset.rw]=t.dataset.rw==="cost"?Math.max(1,parseInt(t.value)||1):t.value.trim()||r[t.dataset.rw];r.at=Date.now();S.shopAt=Date.now();save()}
  if(t.id==="devname"){Sync.setName(t.value.trim())}
  if(t.dataset.kn){const k=kid(t.dataset.kn);if(k&&t.value.trim()){k.name=t.value.trim();save()}}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")back()});
window.addEventListener("popstate",()=>{});

load();home();if(S.family)Sync.start();
</script>
</body>
</html>
