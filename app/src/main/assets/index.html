<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Tidy Quest</title>
<style>
/* Fonts are fetched into assets/fonts by the GitHub build; every face has a fallback. */
@font-face{font-family:"Nunito";src:url(fonts/nunito-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito-800.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"BlackOps";src:url(fonts/black-ops-one.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Kaushan";src:url(fonts/kaushan-script.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Bangers";src:url(fonts/bangers.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Monoton";src:url(fonts/monoton.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Orbitron";src:url(fonts/orbitron.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Graduate";src:url(fonts/graduate.woff2) format("woff2");font-display:swap}

/* Layout: one column, big touch targets; each child theme swaps the tokens below. */
:root{
  --bg:#f3f1ec; --panel:#ffffff; --ink:#22211f; --muted:#6c6862; --line:#e1ddd4;
  --accent:#2f6f5e; --accent-ink:#ffffff; --good:#2e8a4f; --warn:#c9771a; --bad:#c23a32;
  --display:"Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
  --radius:18px;
}
body[data-theme="army"]{--bg:#2f3a24;--panel:#45543a;--ink:#f1ecd6;--muted:#c3c1a4;--line:#5d6c4c;--accent:#e0b23c;--accent-ink:#1f2618;--display:"BlackOps","Impact",sans-serif}
body[data-theme="karate"]{--bg:#f4ede1;--panel:#fffaf2;--ink:#1d1a17;--muted:#7a6f62;--line:#e2d6c3;--accent:#c0262d;--accent-ink:#ffffff;--display:"Kaushan","Brush Script MT",cursive}
body[data-theme="hero"]{--bg:#16245c;--panel:#22357f;--ink:#ffffff;--muted:#b3bfee;--line:#3550a8;--accent:#ffcf1f;--accent-ink:#16245c;--display:"Bangers","Impact",sans-serif}
body[data-theme="pop"]{--bg:#1a0f2e;--panel:#2b1a4a;--ink:#ffffff;--muted:#cbb4ec;--line:#4a2f78;--accent:#ff4fb4;--accent-ink:#1a0f2e;--display:"Monoton","Impact",sans-serif}
body[data-theme="space"]{--bg:#0b1026;--panel:#18204a;--ink:#eef2ff;--muted:#a3aedd;--line:#2a3570;--accent:#5fe0ff;--accent-ink:#0b1026;--display:"Orbitron","Trebuchet MS",sans-serif}
body[data-theme="football"]{--bg:#0f5a32;--panel:#167a45;--ink:#ffffff;--muted:#c4e6d1;--line:#2a8f58;--accent:#f6e05e;--accent-ink:#0f3a22;--display:"Graduate","Rockwell",serif}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  transition:background .3s}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
img{max-width:100%;display:block}
[hidden]{display:none!important}
#app{max-width:760px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}

h1,h2,h3{margin:0;text-wrap:balance}
.display{font-family:var(--display);font-weight:400;letter-spacing:.02em;line-height:1.1}
h1.display{font-size:clamp(28px,7vw,44px)}
h2.display{font-size:clamp(22px,5vw,30px)}
.label{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border-radius:var(--radius);padding:16px;border:2px solid var(--line)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:18px}
.btn.big{min-height:68px;font-size:22px;width:100%}
.btn svg{width:26px;height:26px;flex:none}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{min-height:40px;padding:0 14px;font-size:15px}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:transparent;color:var(--bad);border:2px solid var(--bad)}
.btn:disabled{opacity:.4}
.btn:active{transform:scale(.97)}
.iconbtn{width:48px;height:48px;border-radius:50%;display:inline-grid;place-items:center;border:2px solid var(--line);background:var(--panel)}
.iconbtn svg{width:24px;height:24px}

.topbar{display:flex;align-items:center;gap:12px}
.topbar .grow{flex:1;min-width:0}

/* Kid HQ */
.hq-head{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.badge{width:84px;height:84px}
.badge.sm{width:30px;height:30px;vertical-align:middle}
.avatar{width:120px;height:132px;flex:none}
.avatar.big{width:min(220px,60vw);height:auto}
.avatar.tile{width:100%;height:auto;max-height:150px}
.kidpick .avatar{width:90px;height:99px}
.meter{height:14px;border-radius:999px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .6s}
.wallet{display:flex;align-items:baseline;gap:8px}
.wallet b{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}

.jobcard{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;text-align:left;width:100%;
  background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:10px}
.thumb{width:96px;height:96px;border-radius:12px;object-fit:cover;background:var(--line)}
.jobcard .t{font-weight:800;font-size:19px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:800;background:var(--line);color:var(--ink)}
.chip.wait{background:var(--warn);color:#fff}
.chip.prize{background:var(--accent);color:var(--accent-ink)}

/* Job screen */
.hero-photo{width:100%;max-height:46vh;object-fit:cover;border-radius:var(--radius);background:var(--line)}
.step{display:grid;grid-template-columns:64px 1fr 64px;gap:12px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:10px}
.step.done{opacity:.55}
.step.done .stext{text-decoration:line-through}
.play{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.play svg{width:30px;height:30px}
.tick{width:64px;height:64px;border-radius:50%;border:4px solid var(--line);display:grid;place-items:center}
.tick svg{width:34px;height:34px;opacity:0}
.step.done .tick{background:var(--good);border-color:var(--good);color:#fff}
.step.done .tick svg{opacity:1}
.stext{font-size:19px;font-weight:800;min-width:0}
.clock{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center}

/* Shop */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.reward{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.reward .ico{font-size:44px;line-height:1}
.reward .n{font-weight:800}

/* Style picker */
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.style{border-radius:var(--radius);padding:18px 14px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;border:3px solid transparent}
.style.on{border-color:var(--accent);outline:3px solid var(--ink)}
.style .nm{font-size:26px;line-height:1}

/* Parent */
body.parent{--bg:#f3f1ec;--panel:#fff;--ink:#22211f;--muted:#6c6862;--line:#e1ddd4;--accent:#2f6f5e;--accent-ink:#fff;--display:"Nunito",system-ui,sans-serif}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{padding:10px 16px;border-radius:999px;font-weight:800;white-space:nowrap;border:2px solid var(--line)}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .n{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--warn);color:#fff;font-size:13px}
.photo-slot{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:var(--radius);border:3px dashed var(--line);display:grid;place-items:center;overflow:hidden;background:var(--panel)}
.photo-slot img{width:100%;height:100%;object-fit:cover}
.pstep{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--bg)}
.rec{width:88px;height:88px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;margin:0 auto}
.rec svg{width:38px;height:38px}
.rec.on{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(194,58,50,.25)}}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{padding:10px 14px;border-radius:12px;border:2px solid var(--line);font-weight:800}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair img{aspect-ratio:1;object-fit:cover;border-radius:12px;width:100%}

/* PIN */
.pin-dots{display:flex;gap:14px;justify-content:center}
.pin-dots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink)}
.pin-dots i.on{background:var(--ink)}
.pinpad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center}
.pinpad button{height:76px;border-radius:50%;background:var(--panel);border:2px solid var(--line);font-size:28px;font-weight:800}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);color:var(--ink);border-radius:24px;padding:22px;width:min(520px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.cam{position:fixed;inset:0;z-index:55;background:#000;color:#fff;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.cam-top{display:flex;align-items:center;gap:12px;padding:12px 16px}
.cam-x{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:20px}
.cam-title{flex:1;font-weight:800;font-size:18px}
.cam-time{font-weight:800;color:#ff5a52;font-variant-numeric:tabular-nums}
.cam-view{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden}
.cam-view video{width:100%;height:100%;object-fit:cover}
.cam-view video.mirror{transform:scaleX(-1)}
.cam-msg{position:absolute;color:rgba(255,255,255,.7)}
.cam-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:20px 24px 28px;gap:16px}
.cam-side{justify-self:center;min-width:72px;height:44px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-weight:800;font-size:15px;padding:0 16px}
.shutter{width:84px;height:84px;border-radius:50%;border:5px solid #fff;display:grid;place-items:center;background:transparent}
.shutter i{width:66px;height:66px;border-radius:50%;background:#fff;transition:all .2s}
.shutter.vid i{background:#ff3b30}
.shutter.rec i{width:30px;height:30px;border-radius:8px}
.shutter:active i{transform:scale(.9)}
.cam.flash .cam-view{animation:flash .25s}
@keyframes flash{0%{opacity:.2}100%{opacity:1}}
.photo-slot{position:relative}
.retake{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;padding:8px 14px;border-radius:999px;font-weight:800;font-size:14px}
.media-box{width:100%;border-radius:12px;background:#000;max-height:50vh}
.reward .rphoto{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;max-width:100%}
.ideas{display:flex;flex-wrap:wrap;gap:8px}
.stars{display:flex;flex-wrap:wrap;gap:4px}
.stars i{font-style:normal;font-size:22px;line-height:1;color:var(--line)}
.stars i.on{color:var(--accent)}
.ticon{width:100%;height:100%;display:grid;place-items:center;font-size:56px;background:var(--line)}
.ticon.big{height:auto;aspect-ratio:4/3;border-radius:12px;font-size:96px}
.tthumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#000}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:10px}
.tcard .t{font-weight:800}
.tmedia{position:relative;display:block;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:12px;overflow:hidden;background:#000}
.tmedia video,.tmedia img{width:100%;height:100%;object-fit:cover}
.tplay{position:absolute;inset:0;display:grid;place-items:center;color:#fff}
.tplay svg{width:44px;height:44px;filter:drop-shadow(0 2px 6px #0008)}
.ideas button{padding:8px 12px;border-radius:999px;background:var(--bg);border:2px dashed var(--line);font-weight:800;font-size:14px}
.celebrate{text-align:center}
.celebrate .big{font-size:clamp(30px,8vw,48px)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:800;max-width:90vw}
.kidpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.kidpick button{border-radius:var(--radius);padding:20px;min-height:140px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.empty{text-align:center;padding:28px 16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<canvas id="confetti" hidden></canvas>
<input type="file" id="filepick" accept="image/*" hidden>
<script>
"use strict";
/* ---------- Themes ---------- */
const THEMES={
  army:{label:"Army",job:"Mission",jobs:"Missions",cur:"Medals",start:"Start mission",done:"Mission complete!",
    empty:"No missions today. At ease, soldier!",shop:"Supply Store",hall:"Medal Wall",hello:"Reporting for duty",
    ranks:["Recruit","Private","Corporal","Sergeant","Lieutenant","Captain","General"],
    cheers:["Outstanding work, soldier!","Mission accomplished!","The General is proud!"],wave:"square",notes:[392,523,659,784],swatch:["#2f3a24","#e0b23c"]},
  karate:{label:"Karate",job:"Challenge",jobs:"Challenges",cur:"Points",start:"Bow and begin",done:"Osu! Challenge complete!",
    empty:"No challenges. Rest in the dojo.",shop:"Dojo Shop",hall:"Dojo Wall of Fame",hello:"Welcome to the dojo",
    ranks:["White Belt","Yellow Belt","Orange Belt","Green Belt","Blue Belt","Brown Belt","Black Belt"],
    belts:["#f4f4f4","#f2d22e","#f08a24","#3a9a4a","#2d62c4","#7a4a26","#151515"],
    cheers:["Strong focus!","Sensei is impressed!","Osu!"],wave:"triangle",notes:[330,440,554,659],swatch:["#f4ede1","#c0262d"]},
  hero:{label:"Superhero",job:"Rescue",jobs:"Rescues",cur:"Power",start:"Suit up",done:"You saved the day!",
    empty:"The city is safe. For now.",shop:"Hero Vault",hall:"Hall of Heroes",hello:"Hero HQ",
    ranks:["Sidekick","Rookie Hero","Hero","Super Hero","Captain Hero","Mega Hero","Legend"],
    cheers:["Kapow! Brilliant!","Hero of the house!","Super speed tidy!"],wave:"sawtooth",notes:[262,392,523,784],swatch:["#16245c","#ffcf1f"]},
  pop:{label:"Pop Star",job:"Gig",jobs:"Gigs",cur:"Fans",start:"Hit the stage",done:"Encore! Encore!",
    empty:"No gigs booked. Practise your moves!",shop:"Merch Stand",hall:"Hall of Fame",hello:"Backstage",
    ranks:["Busker","Open Mic","Opening Act","Chart Climber","Headliner","Superstar","Megastar"],
    cheers:["The crowd goes wild!","Number one hit!","What a performance!"],wave:"sine",notes:[523,659,784,1047],swatch:["#1a0f2e","#ff4fb4"]},
  space:{label:"Space",job:"Mission",jobs:"Missions",cur:"Stardust",start:"Blast off",done:"Touchdown! Mission complete!",
    empty:"No missions. Enjoy the view from orbit.",shop:"Space Station Shop",hall:"Mission Log",hello:"Mission Control",
    ranks:["Cadet","Pilot","Navigator","Commander","Captain","Admiral","Star Legend"],
    cheers:["Out of this world!","Houston, we have a tidy room!","Stellar work!"],wave:"sine",notes:[220,330,440,880],swatch:["#0b1026","#5fe0ff"]},
  football:{label:"Football",job:"Drill",jobs:"Drills",cur:"Goals",start:"Kick off",done:"GOAL! Drill complete!",
    empty:"No drills today. Rest those legs.",shop:"Club Shop",hall:"Trophy Cabinet",hello:"The changing room",
    ranks:["Ball Kid","Sub","Starter","Vice Captain","Captain","Golden Boot","Legend"],
    cheers:["What a finish!","Man of the match!","Top bins!"],wave:"square",notes:[294,370,440,587],swatch:["#0f5a32","#f6e05e"]}
};
const RANK_AT=[0,10,25,50,90,150,250];
/* Job types: tidying plus challenges that build the whole child. */
const TYPES={
  tidy:{label:"Tidy up",icon:"🧹",proof:"photo",ideas:["Tidy the bedroom","Toys away in the lounge","Clothes in the washing basket","Make your bed","Clear the table"]},
  active:{label:"Get active",icon:"⚡",proof:"video",ideas:["Ride your scooter to the park","Do a scooter stunt","Bike ride with a grown-up","20 star jumps","Kick a ball 50 times without stopping"]},
  brave:{label:"Be brave & skills",icon:"🦁",proof:"video",ideas:["Learn a new scooter trick","Try a food you've never had","Try a new dip","Swim a width","Tie your own shoelaces","Order your own drink at the café"]},
  kind:{label:"Kindness",icon:"💛",proof:"seen",ideas:["Help cook dinner","Make someone smile today","Write a thank-you card","Help carry the shopping","Share a toy without being asked"]},
  learn:{label:"Learning",icon:"📚",proof:"seen",ideas:["Read for 15 minutes","Practise your spellings","Learn 5 facts about an animal","Draw a map of your street","Count the change at the shop"]}
};
const isChallenge=j=>!!(j&&j.type&&j.type!=="tidy");
const PROOF={photo:"Photo",video:"Video",seen:"A grown-up saw it",none:"No proof"};
const DEFAULT_REWARDS=[
  {icon:"🍮",name:"Pudding after tea",cost:5},
  {icon:"📺",name:"20 minutes extra screen time",cost:8},
  {icon:"🎬",name:"Pick the family film",cost:10},
  {icon:"🌙",name:"Stay up 15 minutes later",cost:12},
  {icon:"🛝",name:"Trip to the park",cost:15},
  {icon:"🪙",name:"£1 pocket money",cost:10}
];

/* ---------- Storage ---------- */
const KEY="tq_state_v1";
let S;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function load(){
  try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S){S={pin:null,kids:[],jobs:[],rewards:DEFAULT_REWARDS.map(r=>({...r,id:uid()})),requests:[]}}
  S.device=S.device||("d"+uid());S.pendingIn=S.pendingIn||{};S.usedIn=S.usedIn||[];S.sent=S.sent||[];
  S.jobs.forEach(j=>{if(!j.type)j.type="tidy";if(!j.proof)j.proof=j.afterReq?"photo":"none"});
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Couldn't save. The tablet may be low on space.")}}

const DB=(()=>{let p;function open(){return p||(p=new Promise((res,rej)=>{const r=indexedDB.open("tq_media",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("b");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
  function tx(mode,fn){return open().then(db=>new Promise((res,rej)=>{const t=db.transaction("b",mode);const q=fn(t.objectStore("b"));
    t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}))}
  return{put:(id,blob)=>tx("readwrite",s=>s.put(blob,id)),get:id=>tx("readonly",s=>s.get(id)),del:id=>tx("readwrite",s=>s.delete(id))}})();
const urlCache={};
async function mediaURL(id){if(!id)return null;if(urlCache[id])return urlCache[id];const b=await DB.get(id);if(!b)return null;return urlCache[id]=URL.createObjectURL(b)}
async function putMedia(blob){const id="m"+uid();await DB.put(id,blob);urlCache[id]=URL.createObjectURL(blob);return id}
function delMedia(id){if(id){DB.del(id).catch(()=>{});if(urlCache[id]){URL.revokeObjectURL(urlCache[id]);delete urlCache[id]}}}
async function hydrate(root){for(const el of root.querySelectorAll("[data-media]")){const u=await mediaURL(el.dataset.media);if(!u)continue;
  if(el.tagName.toLowerCase()==="image")el.setAttribute("href",u);else el.src=u}}

function faceEditor(k,mediaId){const img=new Image();let zoom=1,ox=0,oy=0,drag=null;
  const el=overlay(`<div class="stack" style="align-items:center;text-align:center"><h2 class="display">Line up the face</h2>
    <p class="muted" style="margin:0">Drag and zoom so the face fills the circle, with the eyes on the dotted line.</p>
    <canvas id="fe" width="600" height="600" style="width:min(300px,78vw);aspect-ratio:1;border-radius:16px;touch-action:none;background:#222"></canvas>
    <input id="fz" type="range" min="1" max="4" step="0.01" value="1" aria-label="Zoom" style="width:min(300px,78vw)">
    <div class="row"><button class="btn" id="fsave">Use this</button><button class="btn ghost" id="fretake">Retake</button><button class="btn ghost" data-close>Cancel</button></div></div>`);
  const cv=el.querySelector("#fe"),ctx=cv.getContext("2d"),R=230,CX=300,CY=300;
  const base=()=>Math.max((2*R)/img.width,(2*R)/img.height);
  function draw(){ctx.clearRect(0,0,600,600);const sc=base()*zoom;const w=img.width*sc,h=img.height*sc;
    ctx.drawImage(img,CX-w/2+ox,CY-h/2+oy,w,h);ctx.save();ctx.fillStyle="rgba(0,0,0,.55)";ctx.beginPath();ctx.rect(0,0,600,600);ctx.arc(CX,CY,R,0,Math.PI*2,true);ctx.fill();ctx.restore();
    ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([12,10]);ctx.beginPath();const ey=CY-R+0.45*2*R;ctx.moveTo(CX-R+30,ey);ctx.lineTo(CX+R-30,ey);ctx.stroke();ctx.setLineDash([])}
  mediaURL(mediaId).then(u=>{img.onload=draw;img.src=u});
  const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*600/r.height]};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);drag=[x-ox,y-oy]};
  cv.onpointermove=e=>{if(!drag)return;const[x,y]=pt(e);ox=x-drag[0];oy=y-drag[1];draw()};
  cv.onpointerup=()=>{drag=null};
  el.querySelector("#fz").oninput=e=>{zoom=+e.target.value;draw()};
  el.querySelector("#fretake").onclick=()=>{delMedia(mediaId);overlayClose();ACT.selfie({dataset:{id:k.id}})};
  el.querySelector("#fsave").onclick=()=>{const out=document.createElement("canvas");out.width=out.height=360;const o=out.getContext("2d");
    const f=360/(2*R);const sc=base()*zoom*f;const w=img.width*sc,h=img.height*sc;o.drawImage(img,180-w/2+ox*f,180-h/2+oy*f,w,h);
    out.toBlob(async b=>{const id=await putMedia(b);delMedia(mediaId);if(k.face)delMedia(k.face);k.face=id;save();overlayClose();render();
      setTimeout(()=>{sfxFanfare(k);confetti(k)},200);toast("Looking good, "+k.name+"!")},"image/jpeg",.88)};
  el.addEventListener("click",e=>{if(e.target.closest("[data-close]"))delMedia(mediaId)},true)}

/* ---------- Speech + sound ---------- */
function speak(text){if(!text)return;
  if(window.AndroidTTS){try{AndroidTTS.speak(text);return}catch(e){}}
  if("speechSynthesis" in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-GB";u.rate=.95;speechSynthesis.speak(u)}}
let actx;let curAudio;
function tone(freq,dur,type,when=0,vol=.18){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=freq;const t=actx.currentTime+when;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur)}catch(e){}}
function sfxTick(k){tone(T(k).notes[2],.12,T(k).wave)}
function sfxFanfare(k){const th=T(k);th.notes.forEach((f,i)=>tone(f,.28,th.wave,i*.13));tone(th.notes[3],.7,th.wave,.55)}
async function playClip(id){if(curAudio){curAudio.pause()}const u=await mediaURL(id);if(!u)return;curAudio=new Audio(u);curAudio.play().catch(()=>{})}

/* ---------- Confetti ---------- */
function confetti(k){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#confetti"),x=c.getContext("2d");c.hidden=false;c.width=innerWidth;c.height=innerHeight;
  const cs=getComputedStyle(document.body);const cols=[cs.getPropertyValue("--accent"),"#ffffff",cs.getPropertyValue("--good"),"#ff5f6d","#5fb4ff"];
  const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6.28,s:6+Math.random()*8,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;(function step(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.r+=.15;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(++f<170)requestAnimationFrame(step);else{c.hidden=true}})()}

/* ---------- Navigation ---------- */
let stack=[];let view=null;
function go(name,args={},replace=false){if(view&&!replace)stack.push(view);view={name,args};render()}
function back(){if(overlayClose()){return true}if(!stack.length)return false;view=stack.pop();render();return true}
window.appBack=()=>back()?"handled":"exit";
function home(){stack=[];const kids=S.kids;
  if(!S.pin){view={name:"welcome",args:{}}}
  else if(kids.length===1){view={name:"hq",args:{kid:kids[0].id}}}
  else{view={name:"pick",args:{}}}
  render()}

function setBodyTheme(k,parent){document.body.classList.toggle("parent",!!parent);document.body.dataset.theme=parent?"":(k?k.theme:"")}

const VIEWS={};
async function render(){stopTimer();const v=VIEWS[view.name];const app=$("#app");app.innerHTML=await v(view.args);await hydrate(app);window.scrollTo(0,0);if(v.after)v.after(view.args)}

/* ---------- Overlays ---------- */
let overlayEl=null,overlayOnClose=null;
function overlay(html,onClose){overlayClose();overlayEl=document.createElement("div");overlayEl.className="overlay";overlayEl.innerHTML=`<div class="sheet">${html}</div>`;
  document.body.appendChild(overlayEl);overlayOnClose=onClose;hydrate(overlayEl);return overlayEl}
function overlayClose(){if(!overlayEl)return false;overlayEl.remove();overlayEl=null;const f=overlayOnClose;overlayOnClose=null;if(f)f();return true}

function pinPad(title,sub,onDone){let val="";
  const draw=()=>{$("#pd").innerHTML=[0,1,2,3].map(i=>`<i class="${i<val.length?"on":""}"></i>`).join("")};
  const el=overlay(`<div class="stack" style="align-items:center;text-align:center"><h2 class="display">${esc(title)}</h2><p class="muted" style="margin:0">${esc(sub)}</p>
    <div class="pin-dots" id="pd"></div><div class="pinpad">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(n=>n===""?"<span></span>":`<button data-k="${n}" aria-label="${n==="⌫"?"Delete":n}">${n}</button>`).join("")}</div>
    <button class="btn ghost small" data-k="x">Cancel</button></div>`);
  draw();
  el.addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b)return;const k=b.dataset.k;
    if(k==="x"){overlayClose();return}
    if(k==="⌫"){val=val.slice(0,-1)}else if(val.length<4){val+=k}
    draw();if(val.length===4){const v=val;setTimeout(()=>{if(onDone(v)===false){val="";draw();el.querySelector(".pin-dots").animate([{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"none"}],{duration:250})}},120)}})}

      <span class="chip prize">${isChallenge(j)?"★":"+"+j.credits}</span></button>`).join(""):`<div class="panel empty display" style="font-size:22px">${esc(th.empty)}</div>`}</div>`};
VIEWS.hq.after=({kid:id})=>{const k=kid(id);
  if(k&&k.goalHit&&k.goal){delete k.goalHit;delete k.newTrophy;save();const g=k.goal;

      overlay(`<div class="celebrate stack" style="align-items:center"><span class="label">Big goal reached</span>${g.photo?`<img class="media-box" style="object-fit:cover;max-height:30vh" data-media="${g.photo}" alt="">`:avatarSVG(k,null,"avatar big")||""}
        <div class="display big">${esc(g.name)}</div><p style="margin:0">${g.target} stars, ${esc(k.name)}! You did it.</p><button class="btn big" data-close>Woohoo!</button></div>`)},300);return}
  if(k&&!k.rankUp&&k.newTrophy&&k.trophies&&k.trophies[0]){delete k.newTrophy;save();const t=k.trophies[0],th=T(k);
    setTimeout(()=>{sfxFanfare(k);confetti(k);overlay(`<div class="celebrate stack" style="align-items:center"><span class="label">New in your ${esc(th.hall)}</span><div class="display big">${esc(t.title)}</div>
      ${!t.media?`<div class="ticon big">${TYPES[t.type]?TYPES[t.type].icon:"★"}</div>`:t.kind==="video"?`<video class="media-box" controls autoplay playsinline data-media="${t.media}"></video>`:`<img class="media-box" style="object-fit:contain" data-media="${t.media}" alt="">`}
      <p style="margin:0">${t.star?(k.goal?`★ ${Math.min(k.goal.count,k.goal.target)} of ${k.goal.target} towards ${esc(k.goal.name)}.`:"★ A star for you!"):`+${t.amt} ${esc(th.cur.toLowerCase())}.`} Be proud, ${esc(k.name)}!</p><button class="btn big" data-close>Brilliant</button></div>`)},300);return}

/* ---------- Doing a job ---------- */
let timerInt=null;
function stopTimer(){if(timerInt){clearInterval(timerInt);timerInt=null}}
VIEWS.job=({id})=>{const j=S.jobs.find(x=>x.id===id);const k=kid(j.kid);setBodyTheme(k);const th=T(k);
  const started=!!j.run;const allDone=j.steps.length===0||j.steps.every(s=>j.run&&j.run.done.includes(s.id));
  if(j.status==="pending")return `<div class="topbar"><button class="iconbtn" data-act="back" aria-label="Back">${IC.back}</button><h1 class="display grow">${esc(j.title||th.job)}</h1></div>
    <div class="panel empty stack" style="align-items:center"><h2 class="display">Report sent!</h2><p>A grown-up will check it and give you your ${esc(th.cur.toLowerCase())}.</p></div>`;
  return `
  <div class="topbar"><button class="iconbtn" data-act="back" aria-label="Back">${IC.back}</button><div class="grow"><span class="label">${esc(TYPES[j.type||"tidy"].label)} · ${isChallenge(j)?"★ towards your big goal":"+"+j.credits+" "+esc(th.cur)}</span><h1 class="display">${esc(j.title||th.job)}</h1></div></div>
  ${j.proof==="photo"||j.proof==="video"?`<div class="panel row" style="gap:10px">${IC.cam.replace("<svg",'<svg style="width:28px;height:28px;flex:none"')}<b>When you finish, ${j.proof==="video"?"film a short video":"take a photo"} to show you did it.</b></div>`:""}
  ${j.proof==="seen"?`<div class="panel"><b>A grown-up needs to see you do this one.</b></div>`:""}
  ${j.photo?`<img class="hero-photo" data-media="${j.photo}" alt="The mess to tidy">`:""}
  ${j.timer?`<div class="panel"><div class="clock" id="clock">${fmt(j.timer*60)}</div><p class="muted" style="text-align:center;margin:0">Finish in time for +${bonus(j)} bonus ${esc(th.cur.toLowerCase())}</p></div>`:""}
  ${!started?`<button class="btn big" data-act="startJob" data-id="${j.id}">${esc(th.start)}</button>`:""}
  <div class="stack">${j.steps.map((s,i)=>{const d=started&&j.run.done.includes(s.id);return `<div class="step ${d?"done":""}">
      <button class="play" data-act="playStep" data-job="${j.id}" data-step="${s.id}" aria-label="Listen to step ${i+1}">${IC.play}</button>
      <div class="stext">${esc(s.text||("Step "+(i+1)))}</div>
      <button class="tick" data-act="tickStep" data-job="${j.id}" data-step="${s.id}" aria-label="Step ${i+1} done" ${started?"":"disabled"}>${IC.tick}</button></div>`}).join("")}</div>
  ${started?`<button class="btn big" data-act="finishJob" data-id="${j.id}" ${allDone?"":"disabled"}>${{photo:IC.cam+" Take your proof photo",video:IC.cam+" Film your proof",seen:"Show a grown-up",none:esc(th.done.replace(/!.*$/,"!"))}[j.proof||"none"]}</button>`:""}`};
VIEWS.job.after=({id})=>{const j=S.jobs.find(x=>x.id===id);if(j&&j.run&&j.timer)runClock(j)};
function fmt(sec){sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")}
function bonus(j){return Math.max(1,Math.ceil(j.credits/2))}
function runClock(j){const end=j.run.start+j.timer*60000;const c=$("#clock");const tick=()=>{const left=(end-Date.now())/1000;if(c){c.textContent=left>0?fmt(left):"Time's up!"}};tick();timerInt=setInterval(tick,500)}
async function playStep(j,s){if(s.audio)await playClip(s.audio);else speak(s.text)}

    <button class="btn small" data-act="buy" data-kid="${k.id}" data-id="${r.id}" ${k.credits<r.cost?"disabled":""}>${r.cost} ${esc(th.cur)}</button></div>`).join("")}</div>`};

/* ---------- Parent area ---------- */
const PTABS=[["jobs","Jobs"],["check","To check"],["rewards","Rewards"],["kids","Children"],["link","Link tablets"],["settings","Settings"]];

  check(){const jobs=S.jobs.filter(j=>j.status==="pending");const reqs=S.requests.filter(r=>r.status==="asked");

      <div class="pair">${j.photo?`<figure style="margin:0"><img data-media="${j.photo}" alt="Before"><figcaption class="label">Before</figcaption></figure>`:""}${j.after&&j.afterKind!=="video"?`<figure style="margin:0"><img data-media="${j.after}" alt="Proof"><figcaption class="label">Proof</figcaption></figure>`:""}</div>

/* ---------- Camera (full screen, photo or video) ---------- */
let camStream=null,camRec=null;
function stopCam(){if(camRec&&camRec.state==="recording"){camRec.onstop=null;camRec.stop()}camRec=null;if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}}
function takePhoto(cb,title="Take a photo"){capture({mode:"photo",title},cb)}
function capture({mode="photo",title="Take a photo",facing="environment"},cb){
  const pickFile=()=>{const f=$("#filepick");f.accept=mode==="video"?"video/*":"image/*";f.value="";
    f.onchange=async()=>{const file=f.files[0];if(!file)return;cb(await putMedia(mode==="video"?file:await shrink(file)),mode)};f.click()};
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){pickFile();return}
  overlayClose();overlayEl=document.createElement("div");overlayEl.className="cam";overlayOnClose=stopCam;
  overlayEl.innerHTML=`<div class="cam-top"><button class="cam-x" data-close aria-label="Close">✕</button><span class="cam-title">${esc(title)}</span><span class="cam-time" id="camtime"></span></div>
    <div class="cam-view"><video id="cv" playsinline autoplay muted></video><div class="cam-msg" id="cammsg">Starting camera…</div></div>
    <div class="cam-bar"><button class="cam-side" id="galbtn" aria-label="Choose from gallery">${mode==="video"?"Videos":"Photos"}</button>
      <button class="shutter ${mode==="video"?"vid":""}" id="snapbtn" aria-label="${mode==="video"?"Start recording":"Take photo"}"><i></i></button>
      <button class="cam-side" id="flipbtn" aria-label="Switch camera">Flip</button></div>`;
  document.body.appendChild(overlayEl);const el=overlayEl;
  const v=el.querySelector("#cv"),msg=el.querySelector("#cammsg"),shut=el.querySelector("#snapbtn"),timeEl=el.querySelector("#camtime");
  const start=()=>{if(camStream)camStream.getTracks().forEach(t=>t.stop());
    navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280}},audio:mode==="video"}).then(s=>{camStream=s;v.srcObject=s;msg.hidden=true;v.classList.toggle("mirror",facing==="user")})
      .catch(()=>{overlayClose();pickFile()})};
  start();
  el.querySelector("#galbtn").onclick=()=>{overlayClose();pickFile()};
  el.querySelector("#flipbtn").onclick=()=>{if(camRec)return;facing=facing==="user"?"environment":"user";start()};
  shut.onclick=()=>{if(!v.videoWidth)return;
    if(mode==="photo"){const c=document.createElement("canvas");const sc=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight));
      c.width=v.videoWidth*sc;c.height=v.videoHeight*sc;c.getContext("2d").drawImage(v,0,0,c.width,c.height);
      el.classList.add("flash");c.toBlob(async b=>{overlayClose();cb(await putMedia(b),"photo")},"image/jpeg",.82);return}
    if(camRec&&camRec.state==="recording"){camRec.stop();return}
    const chunks=[];let opts={videoBitsPerSecond:1500000};try{camRec=new MediaRecorder(camStream,opts)}catch(e){camRec=new MediaRecorder(camStream)}
    camRec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    camRec.onstop=async()=>{clearInterval(t);const b=new Blob(chunks,{type:(camRec&&camRec.mimeType)||"video/webm"});camRec=null;overlayClose();cb(await putMedia(b),"video")};
    camRec.start(500);shut.classList.add("rec");shut.setAttribute("aria-label","Stop recording");const t0=Date.now();
    const t=setInterval(()=>{const s=(Date.now()-t0)/1000;timeEl.textContent="● "+fmt(s);if(s>=30&&camRec)camRec.stop()},250)};
}
function shrink(file){return new Promise(res=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,1280/Math.max(img.width,img.height));const c=document.createElement("canvas");
  c.width=img.width*sc;c.height=img.height*sc;c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);c.toBlob(b=>res(b||file),"image/jpeg",.82)};
  img.onerror=()=>res(file);img.src=URL.createObjectURL(file)})}

/* ---------- Voice recorder ---------- */
function stepComposer(){let rec=null,chunks=[],blob=null,stream=null,t0=0,tick=null;
  const el=overlay(`<div class="stack"><h2 class="display">Add a step</h2>
    <p class="muted" style="margin:0">Say exactly what goes where, e.g. "Put all the Lego in the red box under the window."</p>
    <button class="rec" id="recbtn" aria-label="Record">${IC.mic}</button><div id="rect" class="muted" style="text-align:center">Tap to record</div>
    <button class="btn ghost small" id="replay" hidden>${IC.play} Play back</button>
    <label class="label" for="steptext">Words on screen (optional, read aloud if there's no recording)</label>
    <input id="steptext" maxlength="80" placeholder="Lego in the red box">
    <div class="row"><button class="btn" id="stepsave">Add step</button><button class="btn ghost" data-close>Cancel</button></div></div>`,()=>{if(stream)stream.getTracks().forEach(t=>t.stop());clearInterval(tick)});
  const btn=el.querySelector("#recbtn"),lab=el.querySelector("#rect"),rp=el.querySelector("#replay");
  btn.onclick=async()=>{
    if(rec&&rec.state==="recording"){rec.stop();return}
    try{stream=stream||await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){lab.textContent="Microphone not available. Type the words instead.";return}
    chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{blob=new Blob(chunks,{type:rec.mimeType||"audio/webm"});btn.classList.remove("on");btn.innerHTML=IC.mic;clearInterval(tick);lab.textContent="Recorded. Tap the mic to redo it.";rp.hidden=false};
    rec.start();t0=Date.now();btn.classList.add("on");btn.innerHTML=IC.stop;rp.hidden=true;
    tick=setInterval(()=>{const s=(Date.now()-t0)/1000;lab.textContent="Recording "+fmt(s)+" · tap to stop";if(s>45)rec.stop()},250)};
  rp.onclick=()=>{if(blob){if(curAudio)curAudio.pause();curAudio=new Audio(URL.createObjectURL(blob));curAudio.play()}};
  el.querySelector("#stepsave").onclick=async()=>{if(rec&&rec.state==="recording"){toast("Stop recording first");return}
    const text=el.querySelector("#steptext").value.trim();if(!blob&&!text){toast("Record a voice note or type some words");return}
    const step={id:uid(),text,audio:blob?await putMedia(blob):null};draft.steps.push(step);draft._new.push(step.audio);overlayClose();render()}}

function goalEditor(k,draftGoal){const g=draftGoal||(k.goal&&!k.goal.done?{...k.goal}:{name:"",target:20,count:0,photo:null});
  const el=overlay(`<div class="stack"><h2 class="display">Big goal for ${esc(k.name)}</h2>
    <p class="muted" style="margin:0">Brave, active, kind and learning things each add a star. Chores still earn credits for the shop.</p>
    <label class="label" for="gname">The big reward</label><input id="gname" maxlength="40" value="${esc(g.name)}" placeholder="e.g. Water park on holiday">
    <div class="spread"><span>Stars needed</span><span class="row"><button class="btn ghost small" data-g="-5">−5</button><b id="gt" style="font-size:28px;min-width:2ch;text-align:center">${g.target}</b><button class="btn ghost small" data-g="5">+5</button></span></div>
    <div class="row">${g.photo?`<img class="tthumb" data-media="${g.photo}" alt="">`:""}<button class="btn ghost small" id="gphoto">${IC.cam} ${g.photo?"Change photo":"Add a photo"}</button><span class="muted">optional</span></div>
    <div class="row"><button class="btn" id="gsave">Save goal</button><button class="btn ghost" data-close>Cancel</button></div></div>`);
  const nameIn=el.querySelector("#gname");
  el.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{g.target=Math.max(5,Math.min(100,g.target+ +b.dataset.g));el.querySelector("#gt").textContent=g.target});
  el.querySelector("#gphoto").onclick=()=>{g.name=nameIn.value.trim();capture({mode:"photo",title:"Photo of the big reward"},id=>{if(g.photo&&(!k.goal||g.photo!==k.goal.photo))delMedia(g.photo);g.photo=id;goalEditor(k,g)})};
  el.querySelector("#gsave").onclick=()=>{g.name=nameIn.value.trim();if(!g.name){toast("Name the big reward");return}
    if(k.goal&&k.goal.photo&&k.goal.photo!==g.photo)delMedia(k.goal.photo);
    k.goal={name:g.name,target:g.target,count:Math.min(g.count||0,g.target),photo:g.photo||null,done:false};save();overlayClose();render();toast("Goal saved")}}

/* ---------- Shop sharing ---------- */
const SHOP_TAG="TQSHOP1:";
function encodeShop(){const list=S.rewards.map(r=>({i:r.icon,n:r.name,c:r.cost}));return SHOP_TAG+btoa(unescape(encodeURIComponent(JSON.stringify(list))))}
function decodeShop(text){const m=String(text).replace(/\s+/g,"").match(/TQSHOP1:([A-Za-z0-9+/=]+)/);if(!m)return null;
  try{const list=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(!Array.isArray(list))return null;
    return list.filter(x=>x&&x.n).slice(0,60).map(x=>({id:uid(),icon:String(x.i||"⭐").slice(0,4),name:String(x.n).slice(0,60),cost:Math.max(1,Math.min(999,parseInt(x.c)||1))}))}catch(e){return null}}
function shareMessage(){return "Tidy Quest reward shop ("+S.rewards.length+" rewards). To use it: open Tidy Quest → lock → Grown-ups → Rewards → Load a shop, then paste this whole message.\n\n"+encodeShop()}
async function copyText(text){try{if(window.AndroidTTS&&AndroidTTS.copy){AndroidTTS.copy(text);return true}}catch(e){}
  try{await navigator.clipboard.writeText(text);return true}catch(e){return false}}
Object.assign(ACT,{
  shareShop(){const msg=shareMessage();const el=overlay(`<div class="stack"><h2 class="display">Share this shop</h2>
    <p class="muted" style="margin:0">Send this to the other tablet's grown-up, by WhatsApp, text or email. They paste it into <b>Load a shop</b>.</p>
    <textarea id="shopcode" readonly rows="5" style="width:100%;font:13px/1.4 monospace;border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink)">${esc(msg)}</textarea>
    <div class="row">${window.AndroidTTS&&AndroidTTS.share?`<button class="btn" id="sendshop">Send…</button>`:""}<button class="btn ghost" id="copyshop">Copy</button><button class="btn ghost" data-close>Done</button></div></div>`);
    const s=el.querySelector("#sendshop");if(s)s.onclick=()=>{try{AndroidTTS.share(msg)}catch(e){toast("Couldn't open sharing. Use Copy instead.")}};
    el.querySelector("#copyshop").onclick=async()=>{if(await copyText(msg))toast("Copied. Paste it into a message.");else{const t=el.querySelector("#shopcode");t.focus();t.select();toast("Press and hold to copy")}}},
  loadShop(){const el=overlay(`<div class="stack"><h2 class="display">Load a shop</h2>
    <p class="muted" style="margin:0">Paste the whole message you were sent.</p>
    <textarea id="shopin" rows="5" placeholder="Paste here" style="width:100%;font:13px/1.4 monospace;border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);color:var(--ink)"></textarea>
    <div class="row"><button class="btn" id="readshop">Next</button><button class="btn ghost" data-close>Cancel</button></div></div>`);
    el.querySelector("#readshop").onclick=()=>{const list=decodeShop(el.querySelector("#shopin").value);
      if(!list||!list.length){toast("That doesn't look like a Tidy Quest shop. Paste the whole message.");return}
      const sh=overlay(`<div class="stack"><h2 class="display">${list.length} rewards</h2>
        <div class="stack" style="gap:6px">${list.map(r=>`<div class="spread"><span>${esc(r.icon)} ${esc(r.name)}</span><b>${r.cost}</b></div>`).join("")}</div>
        <button class="btn" id="replshop">Replace my shop with these</button><button class="btn ghost" id="addshop">Add these to my shop</button><button class="btn ghost" data-close>Cancel</button></div>`);
      sh.querySelector("#replshop").onclick=()=>{const old=new Map(S.rewards.map(r=>[r.name.toLowerCase(),r]));
        list.forEach(r=>{const o=old.get(r.name.toLowerCase());if(o&&o.photo){r.photo=o.photo;o.photo=null}});old.forEach(o=>delMedia(o.photo));
        S.rewards=list;save();overlayClose();render();toast("Shop loaded")};
      sh.querySelector("#addshop").onclick=()=>{const have=new Set(S.rewards.map(r=>r.name.toLowerCase()));S.rewards.push(...list.filter(r=>!have.has(r.name.toLowerCase())));save();overlayClose();render();toast("Rewards added")}}}
});
/* ---------- QR link between tablets (no internet needed) ---------- */
const QR_TAG="TQ1:";
function packQR(obj){return QR_TAG+btoa(unescape(encodeURIComponent(JSON.stringify(obj))))}
function unpackQR(text){const m=String(text||"").replace(/\s+/g,"").match(/TQ1:([A-Za-z0-9+/=]+)/);
  if(m){try{return JSON.parse(decodeURIComponent(escape(atob(m[1]))))}catch(e){return null}}
  const shop=decodeShop(text);return shop?{t:"shop",list:shop}:null}
const bridge=()=>window.AndroidTTS||null;
function showQR(text,title,sub,extra){const b=bridge();let img="";
  try{if(b&&b.makeQR)img=b.makeQR(text)}catch(e){}
  const el=overlay(`<div class="stack" style="align-items:center;text-align:center"><h2 class="display">${esc(title)}</h2><p class="muted" style="margin:0">${esc(sub)}</p>
    ${img?`<img src="${img}" alt="QR code" style="width:min(320px,80vw);image-rendering:pixelated;background:#fff;padding:10px;border-radius:12px">`:""}
    <details style="width:100%"><summary class="muted">Can't scan? Use the text code</summary>
      <textarea readonly rows="4" style="width:100%;font:12px/1.4 monospace;margin-top:8px;border:2px solid var(--line);border-radius:12px;padding:8px;background:var(--bg);color:var(--ink)">${esc(text)}</textarea>
      <button class="btn ghost small" data-copy>Copy text code</button></details>
    ${extra||""}<button class="btn ghost" data-close>Close</button></div>`);
  el.querySelector("[data-copy]").onclick=async()=>{toast(await copyText(text)?"Copied":"Press and hold the code to copy")};return el}
function scanQR(cb){const b=bridge();
  if(b&&b.scanQR){window.__onScan=t=>{window.__onScan=null;if(t)cb(t)};try{b.scanQR();return}catch(e){}}
  const el=overlay(`<div class="stack"><h2 class="display">Enter a code</h2><p class="muted" style="margin:0">Paste the text code from the other tablet.</p>
    <textarea id="qrin" rows="4" style="width:100%;font:12px/1.4 monospace;border:2px solid var(--line);border-radius:12px;padding:8px;background:var(--panel);color:var(--ink)"></textarea>
    <div class="row"><button class="btn" id="qrgo">Use code</button><button class="btn ghost" data-close>Cancel</button></div></div>`);
  el.querySelector("#qrgo").onclick=()=>{const t=el.querySelector("#qrin").value;overlayClose();cb(t)}}
function findKidFor(id,name){return kid(id)||S.kids.find(k=>k.name.trim().toLowerCase()===String(name||"").trim().toLowerCase())}
function handleCode(text){const d=unpackQR(text);
  if(!d){toast("That isn't a Tidy Quest code.");return}
  if(d.from&&d.from===S.device){toast("That code is from this tablet. Scan it on the other one.");return}
  if(d.t==="shop"){S.rewards=d.list;save();render();toast("Shop loaded");return}
  if(d.t==="setup")return applySetup(d);
  if(d.t==="req")return sendCredits(d);
  if(d.t==="give")return acceptCredits(d);
  toast("This code needs a newer version of Tidy Quest.")}
function applySetup(d){const added=[],matched=[];
  d.kids.forEach(x=>{let k=findKidFor(x.id,x.name);
    if(k){if(k.id!==x.id){S.jobs.forEach(j=>{if(j.kid===k.id)j.kid=x.id});S.requests.forEach(r=>{if(r.kid===k.id)r.kid=x.id});k.id=x.id}
      k.name=x.name;k.theme=x.theme;matched.push(x.name)}
    else{S.kids.push({id:x.id,name:x.name,theme:x.theme,credits:0,earned:0});added.push(x.name)}});
  if(d.shop&&d.shop.length){const old=new Map(S.rewards.map(r=>[r.name.toLowerCase(),r]));
    S.rewards=d.shop.map(x=>{const o=old.get(String(x.n).toLowerCase());return {id:uid(),icon:x.i,name:x.n,cost:x.c,photo:o?o.photo:null}});
    const kept=new Set(S.rewards.map(r=>r.photo));old.forEach(o=>{if(o.photo&&!kept.has(o.photo))delMedia(o.photo)})}
  save();render();
  overlay(`<div class="stack"><h2 class="display">Setup copied</h2>
    ${matched.length?`<p style="margin:0">Matched: <b>${esc(matched.join(", "))}</b></p>`:""}${added.length?`<p style="margin:0">Added: <b>${esc(added.join(", "))}</b></p>`:""}
    <p class="muted" style="margin:0">Reward shop updated. Credits on this tablet haven't changed. Use <b>Move credits</b> to bring credits across.</p><button class="btn" data-close>Done</button></div>`)}
function setupCode(){return packQR({t:"setup",from:S.device,kids:S.kids.map(k=>({id:k.id,name:k.name,theme:k.theme})),shop:S.rewards.map(r=>({i:r.icon,n:r.name,c:r.cost}))})}
/* Credit transfer handshake: receiver shows a one-time request; sender deducts and shows a code locked to that request. */
function receiveCode(k){const n="n"+uid();S.pendingIn[n]={kid:k.id,at:Date.now()};save();return packQR({t:"req",from:S.device,n,kid:k.id,name:k.name})}
function sendCredits(d){const k=findKidFor(d.kid,d.name);
  if(!k){toast(`There's no child called ${d.name} on this tablet. Copy the setup first.`);return}
  const prev=S.sent.find(x=>x.n===d.n);
  if(prev){showGive(prev);return}
  if(k.credits<1){toast(`${k.name} has no credits on this tablet to send.`);return}
  let amt=k.credits;
  const el=overlay(`<div class="stack"><h2 class="display">Send ${esc(k.name)}'s credits</h2><p class="muted" style="margin:0">They come off this tablet as soon as you tap Send.</p>
    <div class="spread"><button class="btn ghost" data-d="-5">−5</button><button class="btn ghost" data-d="-1">−1</button><b id="amt" style="font-size:40px;font-variant-numeric:tabular-nums">${amt}</b><button class="btn ghost" data-d="1">+1</button><button class="btn ghost" data-d="5">+5</button></div>
    <p class="muted" style="margin:0;text-align:center">${k.credits} available</p>
    <div class="row"><button class="btn" id="sendc">Send</button><button class="btn ghost" data-close>Cancel</button></div></div>`);
  el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{amt=Math.max(1,Math.min(k.credits,amt+ +b.dataset.d));el.querySelector("#amt").textContent=amt});
  el.querySelector("#sendc").onclick=()=>{if(amt<1||amt>k.credits)return;k.credits-=amt;
    const rec={n:d.n,to:d.from,kid:d.kid,name:k.name,amt,at:Date.now()};S.sent.push(rec);if(S.sent.length>50)S.sent.shift();save();overlayClose();render();showGive(rec)}}
function showGive(rec){showQR(packQR({t:"give",from:S.device,to:rec.to,n:rec.n,kid:rec.kid,name:rec.name,amt:rec.amt}),`${rec.amt} credits for ${rec.name}`,"Now scan this on the tablet that asked for them.")}
function acceptCredits(d){
  if(d.to!==S.device){toast("This transfer was made for a different tablet.");return}
  if(S.usedIn.includes(d.n)){toast("This transfer has already been added.");return}
  const p=S.pendingIn[d.n];if(!p){toast("This tablet didn't ask for that transfer.");return}
  const k=kid(p.kid);if(!k){toast("That child isn't on this tablet any more.");return}
  k.credits+=d.amt;delete S.pendingIn[d.n];S.usedIn.push(d.n);if(S.usedIn.length>200)S.usedIn.shift();save();overlayClose();render();sfxFanfare(k);confetti(k);
  overlay(`<div class="stack" style="text-align:center;align-items:center"><h2 class="display">+${d.amt} for ${esc(k.name)}</h2><p style="margin:0">${esc(k.name)} now has ${k.credits} credits on this tablet.</p><button class="btn" data-close>Done</button></div>`)}
Object.assign(ACT,{
  scanAny(){scanQR(handleCode)},
  showSetup(){showQR(setupCode(),"Family setup","On the other tablet: Grown-ups → Link tablets → Scan a code.")},
  receiveCredits(b){const k=kid(b.dataset.id);const el=showQR(receiveCode(k),`Receive credits for ${k.name}`,"1. Scan this on the other tablet (Link tablets → Scan a code). 2. Then scan the code it shows back.",
    `<button class="btn" id="scanback">${IC.cam} Scan their code</button>`);
    el.querySelector("#scanback").onclick=()=>{overlayClose();scanQR(handleCode)}}
});
function keepTitle(){const t=$("#dtitle");if(t&&draft)draft.title=t.value.trim()}
function confirmSheet(title,sub,yes){overlay(`<div class="stack"><h2 class="display">${esc(title)}</h2><p class="muted" style="margin:0">${esc(sub)}</p>
  <div class="row"><button class="btn bad" id="cyes">Yes, delete</button><button class="btn ghost" data-close>Keep it</button></div></div>`).querySelector("#cyes").onclick=()=>{overlayClose();yes()}}

document.addEventListener("click",e=>{
  if(e.target.closest("[data-close]")){overlayClose();return}
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b)});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.rw){const r=S.rewards.find(x=>x.id===t.dataset.id);if(!r)return;r[t.dataset.rw]=t.dataset.rw==="cost"?Math.max(1,parseInt(t.value)||1):t.value.trim()||r[t.dataset.rw];save()}
  if(t.dataset.kn){const k=kid(t.dataset.kn);if(k&&t.value.trim()){k.name=t.value.trim();save()}}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")back()});
window.addEventListener("popstate",()=>{});

load();home();
</script>
</body>
</html>
