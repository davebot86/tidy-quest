name: Build Tidy Quest APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle theme fonts so the app works offline
        run: |
          set -u
          mkdir -p /tmp/fonts && cd /tmp/fonts
          out="$GITHUB_WORKSPACE/app/src/main/assets/fonts"
          mkdir -p "$out"
          # package:weight pairs; file name in the app is <package>-<weight>.woff2
          for pair in nunito:400 nunito:700 nunito:900 shippori-mincho-b1:800 saira-stencil-one:400 bangers:400 bungee:400 orbitron:700 bebas-neue:400; do
            pkg="${pair%%:*}"; w="${pair##*:}"
            if [ ! -d "$pkg" ]; then
              npm pack "@fontsource/$pkg" --silent >/dev/null 2>&1 && mkdir -p "$pkg" && tar xzf fontsource-$pkg-*.tgz -C "$pkg" --strip-components=1 || echo "::warning::could not fetch $pkg"
            fi
            f=$(ls "$pkg"/files/*-latin-$w-normal.woff2 2>/dev/null | grep -v ext | head -1 || true)
            if [ -n "$f" ]; then cp "$f" "$out/$pkg-$w.woff2"; else echo "::warning::no latin $w file for $pkg, app will use the fallback font"; fi
          done
          ls -l "$out"

      - name: Bundle Firebase for live sync
        run: |
          set -e
          mkdir -p /tmp/fb && cd /tmp/fb
          npm pack firebase@10.14.1 --silent >/dev/null
          tar xzf firebase-10.14.1.tgz
          out="$GITHUB_WORKSPACE/app/src/main/assets/vendor"
          mkdir -p "$out"
          for f in firebase-app-compat.js firebase-auth-compat.js firebase-firestore-compat.js; do
            src=$(find package -name "$f" | head -1)
            if [ -z "$src" ]; then echo "::error::$f not found in firebase package"; find package -maxdepth 2 -name "*compat*"; exit 1; fi
            cp "$src" "$out/$f"
          done
          ls -l "$out"

      - name: Use the runner's preinstalled Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "Android SDK at $ANDROID_HOME"; ls "$ANDROID_HOME/platforms" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set version from build number (so the in-app updater always sees a newer one)
        run: |
          vc=$((1000 + ${{ github.run_number }}))
          sed -i -E "s/versionCode [0-9]+/versionCode $vc/; s/versionName '[^']*'/versionName '0.${{ github.run_number }}-trial'/" app/build.gradle
          grep -n "version" app/build.gradle
          echo "{\"versionCode\": $vc, \"name\": \"0.${{ github.run_number }}-trial\"}" > version.json
          cat version.json

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk TidyQuest-trial.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TidyQuest-trial
          path: TidyQuest-trial.apk

      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete trial --yes --cleanup-tag || true
          gh release create trial TidyQuest-trial.apk version.json \
            --title "Tidy Quest trial build" \
            --notes "Build ${{ github.run_number }}. Download TidyQuest-trial.apk on the Android tablet and open it to install."

  web:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the web version (same app, served as a page for iPhone and the browser)
        run: |
          set -e
          rm -rf web && mkdir -p web/vendor web/fonts
          cp -r app/src/main/assets/. web/
          mkdir -p /tmp/fb && cd /tmp/fb && npm pack firebase@10.14.1 --silent >/dev/null && tar xzf firebase-10.14.1.tgz
          for f in firebase-app-compat.js firebase-auth-compat.js firebase-firestore-compat.js; do cp "$(find package -name "$f" | head -1)" "$GITHUB_WORKSPACE/web/vendor/$f"; done
          cd /tmp && mkdir -p fonts && cd fonts
          for pair in nunito:400 nunito:700 nunito:900 shippori-mincho-b1:800 saira-stencil-one:400 bangers:400 bungee:400 orbitron:700 bebas-neue:400; do
            pkg="${pair%%:*}"; w="${pair##*:}"
            [ -d "$pkg" ] || { npm pack "@fontsource/$pkg" --silent >/dev/null 2>&1 && mkdir -p "$pkg" && tar xzf fontsource-$pkg-*.tgz -C "$pkg" --strip-components=1; }
            f=$(ls "$pkg"/files/*-latin-$w-normal.woff2 2>/dev/null | grep -v ext | head -1 || true)
            [ -n "$f" ] && cp "$f" "$GITHUB_WORKSPACE/web/fonts/$pkg-$w.woff2"
          done
          ls -la "$GITHUB_WORKSPACE/web" | head -30

      - name: Publish to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SA" ]; then
            echo "$FIREBASE_SA" > /tmp/sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
            npx --yes firebase-tools@13 deploy --only hosting --project project-tidy-quest --non-interactive
          elif [ -n "$FIREBASE_TOKEN" ]; then
            npx --yes firebase-tools@13 deploy --only hosting --project project-tidy-quest --non-interactive --token "$FIREBASE_TOKEN"
          else
            echo "::warning::No FIREBASE_SERVICE_ACCOUNT or FIREBASE_TOKEN secret yet, so the web version was built but not published."
          fi
